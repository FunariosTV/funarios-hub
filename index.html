<style>
:root{
  --bg:#0a0a0c; --bg2:#101014; --panel:#15151a; --panel2:#1c1c23; --panel3:#24242d;
  --line:#2a2a34; --line2:#3a3a46;
  --text:#f3f3f6; --muted:#9b9baa; --dim:#6e6e7c;
  --red:#e5322d; --red2:#ff5a54; --blue:#2f7de1; --blue2:#5b9bff; --green:#2bb673; --green2:#4ad693;
  --amber:#f2a93b; --purple:#9b6dff;
  --radius:12px; --radius-s:8px;
  --shadow:0 10px 40px rgba(0,0,0,.45);
  --side:240px;
  --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --display:'Archivo Black','Inter',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue2);text-decoration:none}
a:hover{text-decoration:underline}
.hidden{display:none!important}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:13px} .tiny{font-size:12px}
.nowrap{white-space:nowrap}
.mono{font-variant-numeric:tabular-nums}
.brand-font{font-family:var(--display);letter-spacing:.3px}
.rings{display:inline-flex;gap:3px;vertical-align:middle}
.rings i{width:12px;height:12px;border-radius:50%;border:3px solid}
.rings i:nth-child(1){border-color:var(--red)} .rings i:nth-child(2){border-color:var(--blue)} .rings i:nth-child(3){border-color:var(--green)}
.rings.big i{width:22px;height:22px;border-width:5px}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--red);color:#fff;border:0;border-radius:var(--radius-s);padding:10px 16px;font-weight:700;cursor:pointer;white-space:nowrap;transition:filter .15s, background .15s}
.btn:hover{filter:brightness(1.1);text-decoration:none}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--text)}
.btn.ghost:hover{background:var(--panel2)}
.btn.soft{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.blue{background:var(--blue)} .btn.green{background:var(--green)}
.btn.danger{background:transparent;border:1px solid rgba(229,50,45,.5);color:var(--red2)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.tiny{padding:4px 8px;font-size:12px;border-radius:6px}
.btn.icon{padding:8px;width:36px;height:36px}
.ic{width:18px;height:18px;flex:none}
.btn .ic{width:16px;height:16px}
.card h3 .ic{width:18px;height:18px;color:var(--muted)}
label.lbl{display:block;font-size:12px;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
input.in,select.in,textarea.in{width:100%;padding:10px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius-s);color:var(--text);outline:none}
textarea.in{min-height:90px;resize:vertical;line-height:1.45}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,125,225,.18)}
input[type=checkbox]{accent-color:var(--red);width:16px;height:16px}
.field{margin-bottom:14px}
.field .hint{font-size:12px;color:var(--dim);margin-top:4px}
.req::after{content:" *";color:var(--red2)}
.err{color:#ff7a75;font-size:14px}
.search{position:relative;flex:1;min-width:160px;max-width:340px}
.search input{padding-left:34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--dim)}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:16px;background:
  radial-gradient(600px 300px at 15% 10%,rgba(229,50,45,.13),transparent 70%),
  radial-gradient(600px 300px at 85% 90%,rgba(47,125,225,.12),transparent 70%),
  radial-gradient(500px 260px at 80% 15%,rgba(43,182,115,.08),transparent 70%), var(--bg)}
.login-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px 28px;width:100%;max-width:400px;box-shadow:var(--shadow)}
.login-card h1{margin:16px 0 4px;font-size:30px}
.login-card p{margin:0 0 22px;color:var(--muted);font-size:14px}
.login-card .field{margin-bottom:12px}
.login-card .btn{width:100%;margin-top:10px;padding:12px}
.pw-wrap{position:relative}
.pw-wrap button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;padding:6px}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
aside#side{background:var(--bg2);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side-brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;font-size:19px}
.nav-group{margin:6px 0 10px}
.nav-group h6{margin:10px 10px 4px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--muted);padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.nav-item svg{width:18px;height:18px;flex:none}
.nav-item:hover{background:var(--panel);color:var(--text)}
.nav-item.active{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--red)}
.nav-item .count{margin-left:auto;background:var(--red);color:#fff;font-size:11px;border-radius:99px;padding:1px 7px}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 4px}
.who{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--panel3);color:var(--text);flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.who b{display:block;font-size:14px}
.who span{font-size:12px;color:var(--muted)}
main{min-width:0;padding:26px 30px 90px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.topbar h1{margin:0;font-size:26px;font-family:var(--display);letter-spacing:.3px}
.topbar .sub{color:var(--muted);font-size:14px;margin-top:2px;width:100%}
.topbar .spacer{flex:1}
.mobile-top{display:none}
.bottom-nav{display:none}
.netbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;background:linear-gradient(90deg,var(--red),var(--blue),var(--green));transform-origin:left;transform:scaleX(0);transition:transform .3s;opacity:0}
.netbar.on{opacity:1;animation:load 1.2s ease-in-out infinite}
@keyframes load{0%{transform:scaleX(.05)}50%{transform:scaleX(.7)}100%{transform:scaleX(1);opacity:.2}}

/* ---------- cards / stats ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .more{margin-left:auto;font-size:13px;font-weight:600}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden;cursor:default}
.stat.link{cursor:pointer} .stat.link:hover{border-color:var(--line2)}
.stat .n{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-top:6px;font-weight:600}
.stat .s{font-size:13px;color:var(--muted);margin-top:4px}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line2)}
.stat.red::before{background:var(--red)} .stat.blue::before{background:var(--blue)} .stat.green::before{background:var(--green)} .stat.amber::before{background:var(--amber)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .when{min-width:58px;text-align:center;background:var(--panel2);border-radius:8px;padding:6px 4px;font-size:11px;color:var(--muted);line-height:1.2}
.li .when b{display:block;font-size:17px;color:var(--text)}
.li .body{flex:1;min-width:0}
.li .t{font-weight:600}
.li .m{font-size:13px;color:var(--muted);margin-top:2px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px;background:var(--dim)}
.dot.red{background:var(--red)} .dot.amber{background:var(--amber)} .dot.green{background:var(--green)} .dot.blue{background:var(--blue)} .dot.purple{background:var(--purple)}
.empty{padding:34px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--radius)}
.empty b{display:block;color:var(--text);margin-bottom:4px;font-size:15px}
.banner{display:flex;gap:12px;align-items:flex-start;background:rgba(242,169,59,.08);border:1px solid rgba(242,169,59,.35);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;font-size:14px}
.banner.red{background:rgba(229,50,45,.08);border-color:rgba(229,50,45,.4)}
.banner.blue{background:rgba(47,125,225,.08);border-color:rgba(47,125,225,.4)}
.banner.green{background:rgba(43,182,115,.08);border-color:rgba(43,182,115,.4)}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--panel3);color:var(--muted);white-space:nowrap}
.pill.green{background:rgba(43,182,115,.15);color:var(--green2)}
.pill.red{background:rgba(229,50,45,.15);color:var(--red2)}
.pill.blue{background:rgba(47,125,225,.15);color:var(--blue2)}
.pill.amber{background:rgba(242,169,59,.15);color:var(--amber)}
.pill.purple{background:rgba(155,109,255,.15);color:#b99bff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip:hover{color:var(--text)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}

/* ---------- toolbar / tables ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar select.in{width:auto;min-width:130px;padding:9px 10px}
.table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
.tbl th.sorted{color:var(--text)}
.tbl th .arr{opacity:.7;font-size:10px}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--panel2)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl td .clip{display:block;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl tr.sel{background:rgba(47,125,225,.1)}
.tbl tfoot td{font-weight:800;background:var(--panel2)}
.table-foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;padding:10px 2px}
.cards-m{display:none}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer}
.mcard .row1{display:flex;gap:8px;align-items:center;justify-content:space-between}
.mcard .t{font-weight:700}
.mcard .meta{font-size:13px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 12px}

/* ---------- drawer & modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);z-index:50;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--bg2);border-left:1px solid var(--line);z-index:51;display:flex;flex-direction:column;animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.drawer header,.modal header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer header h2,.modal header h2{margin:0;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.drawer .content{flex:1;overflow-y:auto;padding:20px}
.drawer footer,.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 40px);background:var(--bg2);border:1px solid var(--line);border-radius:16px;z-index:52;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:pop .15s ease-out}
.modal.small{width:min(420px,calc(100vw - 24px))}
@keyframes pop{from{transform:translate(-50%,-48%);opacity:0}}
.modal .content{padding:20px;overflow-y:auto}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:22px;line-height:1;padding:4px 8px;border-radius:6px}
.x:hover{background:var(--panel2);color:var(--text)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word;white-space:pre-wrap}
.section-title{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin:20px 0 10px;font-weight:700}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.form-grid .wide{grid-column:1/-1}
.ms{display:flex;flex-wrap:wrap;gap:6px}
.ms label{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:13px;cursor:pointer}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.stars{display:inline-flex;gap:2px}
.stars button{background:none;border:0;cursor:pointer;font-size:20px;color:var(--line2);padding:0 1px;line-height:1}
.stars button.on{color:var(--amber)}
.stars.ro button{cursor:default;font-size:14px}

/* ---------- toast ---------- */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--panel3);border:1px solid var(--line2);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);animation:pop2 .2s;max-width:90vw}
.toast.err{border-color:rgba(229,50,45,.6)} .toast.ok{border-color:rgba(43,182,115,.6)}
@keyframes pop2{from{transform:translateY(10px);opacity:0}}

/* ---------- attendance ---------- */
.att-row{display:grid;grid-template-columns:minmax(150px,1.2fr) 170px auto minmax(140px,1fr) 34px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.att-row:last-child{border-bottom:0}
.att-row .name{font-weight:700}
.att-row .name small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.seg button{background:none;border:0;color:var(--muted);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on.full{background:var(--green);color:#fff}
.seg button.on.partial{background:var(--amber);color:#111}
.seg button.on.no{background:var(--red);color:#fff}
.att-row.st-partial{background:rgba(242,169,59,.06)} .att-row.st-no{background:rgba(229,50,45,.07)}
.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.datebar .in{width:auto}

/* ---------- payroll ---------- */
.hero{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:14px;margin-bottom:16px}
.hero .big .n{font-size:38px}
.paid-yes{color:var(--green2);font-weight:700}
.lines{background:var(--bg2);padding:8px 14px 12px}
.lines table{width:100%;font-size:13px;border-collapse:collapse}
.lines td{padding:6px 8px;border-bottom:1px dashed var(--line)}

/* ---------- talent gallery ---------- */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;position:relative;transition:border-color .15s, transform .15s}
.tcard:hover{border-color:var(--line2);transform:translateY(-2px)}
.tcard.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.tcard .ph{aspect-ratio:4/5;background:var(--panel2);display:grid;place-items:center;font-size:40px;font-weight:800;color:var(--dim);overflow:hidden}
.tcard .ph img{width:100%;height:100%;object-fit:cover}
.tcard .info{padding:10px 12px}
.tcard .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .info span{font-size:12px;color:var(--muted)}
.tcard .st{position:absolute;top:8px;left:8px}
.tcard .ck{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:6px;background:rgba(0,0,0,.6);border:1px solid var(--line2);display:grid;place-items:center;font-size:14px}
.tcard.sel .ck{background:var(--blue);border-color:var(--blue)}
.photos{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}
.photos img{height:220px;border-radius:10px;object-fit:cover;background:var(--panel2)}
.selbar{position:sticky;bottom:14px;z-index:20;margin-top:16px;background:var(--panel3);border:1px solid var(--line2);border-radius:14px;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}

/* ---------- calendar ---------- */
.cal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-head div{padding:8px 10px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;font-weight:700;border-bottom:1px solid var(--line)}
.cal-day{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;cursor:pointer;overflow:hidden}
.cal-day:nth-child(7n){border-right:0}
.cal-day:hover{background:var(--panel2)}
.cal-day.out{opacity:.4}
.cal-day .d{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.cal-day.today .d{background:var(--red);color:#fff;border-radius:99px;display:inline-block;padding:1px 7px}
.ev{font-size:11.5px;padding:2px 6px;border-radius:5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--panel3);border-left:3px solid var(--dim)}
.ev.Shoot{border-color:var(--red);background:rgba(229,50,45,.12)}
.ev.Release{border-color:var(--green);background:rgba(43,182,115,.12)}
.ev.Deadline{border-color:var(--amber);background:rgba(242,169,59,.12)}

.tk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.tk:hover{border-color:var(--line2)}
.tk .t{font-weight:600;font-size:14px}
.tk .m{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.perm select{padding:5px 6px;font-size:13px;width:auto;min-width:76px;border-radius:6px;background:var(--bg2);border:1px solid var(--line);color:var(--text)}

.perm td:first-child{font-weight:600;white-space:nowrap}
.perm th{cursor:default}
.setting-row{display:grid;grid-template-columns:220px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}

.sk{background:linear-gradient(90deg,var(--panel) 0%,var(--panel2) 50%,var(--panel) 100%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}

/* ---------- responsive ---------- */
@media (max-width:1100px){

}
@media (max-width:820px){

}

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

}

const pad2 = n => String(n).padStart(2, '0');
function todayIso() { return new Intl.DateTimeFormat('en-CA', { timeZone: (S.boot && S.boot.settings.timezone) || 'America/New_York' }).format(new Date()); }
function isoToDate(iso) { const p = String(iso).split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2], 12)); }
function addDays(iso, n) { const d = isoToDate(iso); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function daysBetween(a, b) { return Math.round((isoToDate(b) - isoToDate(a)) / 86400000); }
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

}

      } catch (e) { lastErr = e; await new Promise(r => setTimeout(r, 700)); }
    }
    if (!res) throw new Error('Can\'t reach the server. Check your internet connection. (' + (lastErr && lastErr.message) + ')');
    let out;
    try { out = await res.json(); } catch (e) { throw new Error('The server sent back something unexpected. If you just updated the script, make sure it\'s deployed as a new version.'); }
    if (!out.ok && out.error === 'SESSION_EXPIRED') {
      if (!opts.quiet) toast('Your session ended — please sign in again.', 'err');
      signOutLocal();
      throw new Error('SESSION_EXPIRED');
    }
    if (!out.ok) throw new Error(out.error || 'Something went wrong.');
    return out;
  } finally { setBusy(-1); }
}

// Cached module rows (refetched when stale or forced).
async function rows(moduleKey, force) {
  const c = S.cache[moduleKey];
  // Live mode: the cache is dropped the moment anyone changes this section, so it can live longer.
  if (!force && c && Date.now() - c.at < (LIVE.on ? 600000 : 60000)) return c.rows;
  let list;
  if (LIVE.on) {
    setBusy(1);
    try { list = await liveRows(moduleKey); }
    catch (e) { if (e.message === 'SESSION_EXPIRED') { signOutLocal(); throw e; } list = (await api('list', { module: moduleKey })).rows; }
    finally { setBusy(-1); }
  } else list = (await api('list', { module: moduleKey })).rows;
  S.cache[moduleKey] = { rows: list, at: Date.now() };
  return list;
}
function patchCache(moduleKey, row, removeId) {
  const c = S.cache[moduleKey];
  if (!c) return;
  if (removeId) { c.rows = c.rows.filter(r => r.id !== removeId); return; }
  const i = c.rows.findIndex(r => r.id === row.id);
  if (i >= 0) c.rows[i] = row; else c.rows.push(row);
}
function invalidate(...keys) { keys.forEach(k => delete S.cache[k]); }

// ---------- permissions ----------
const LEVELS = ['none', 'own', 'view', 'edit', 'full'];
function modOf(key) { return S.boot && S.boot.modules.find(m => m.key === key); }
function access(key) { const m = modOf(key); return m ? m.access : 'none'; }
function can(key, lvl = 'view') { return LEVELS.indexOf(access(key)) >= LEVELS.indexOf(lvl); }
function canCreate(key) { const m = modOf(key); return !!m && !m.readonly && !m.computed && (can(key, 'edit') || (m.access === 'own' && m.ownCreate)); }
function canEditRow(key, row) {
  const m = modOf(key);
  if (!m || m.readonly) return false;
  if (can(key, 'edit')) return true;
  if (m.access !== 'own' || !m.ownEditable.length) return false;
  if (key === 'deliverables' && !['Pending', 'Needs Changes'].includes(row.status)) return false;
  if (key === 'supplies' && row.status !== 'Requested') return false;
  return true;
}
function fieldOf(key, k) { const m = modOf(key); return m && m.fields.find(f => f.k === k); }

// ---------- toasts ----------
function toast(msg, kind = '') {
  const box = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, kind === 'err' ? 4500 : 2600);
}
function fail(e) { if (e && e.message !== 'SESSION_EXPIRED') toast(e.message || String(e), 'err'); }

// ---------- overlays (modal, drawer, confirm, prompt) ----------
const stack = [];
function closeTop() { const top = stack.pop(); if (top) { top.el.remove(); top.ov.remove(); if (top.onClose) top.onClose(); } }
function closeAll() { while (stack.length) closeTop(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && stack.length) closeTop(); });
function openLayer(kind, { title, body, footer, cls = '', onClose }) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.addEventListener('click', closeTop);
  const el = document.createElement('div');
  el.className = kind + ' ' + cls;
  el.setAttribute('role', 'dialog');
  el.innerHTML = `<header><h2>${title}</h2><button class="x" aria-label="Close">&times;</button></header>
    <div class="content"></div>${footer !== undefined ? '<footer></footer>' : ''}`;
  el.querySelector('.x').onclick = closeTop;
  const content = el.querySelector('.content');
  if (typeof body === 'string') content.innerHTML = body; else if (body) content.appendChild(body);
  if (footer !== undefined) { const f = el.querySelector('footer'); if (typeof footer === 'string') f.innerHTML = footer; else f.appendChild(footer); }
  document.body.appendChild(ov); document.body.appendChild(el);
  stack.push({ el, ov, onClose });
  const first = el.querySelector('input:not([type=checkbox]):not([readonly]),select,textarea');
  if (first && kind === 'modal' && window.innerWidth > 820) setTimeout(() => first.focus(), 50);
  return el;
}
const modal = o => openLayer('modal', o);
const drawer = o => openLayer('drawer', o);
function confirmBox(message, { ok = 'Yes', danger = false, title = 'Are you sure?' } = {}) {
  return new Promise(resolve => {
    let done = false;
    const el = modal({ title: esc(title), cls: 'small', body: `<p style="margin:0;line-height:1.5">${message}</p>`,
      footer: `<button class="btn ghost" data-a="no">Cancel</button><button class="btn ${danger ? 'danger' : ''}" data-a="yes">${esc(ok)}</button>`,
      onClose: () => { if (!done) resolve(false); } });
    el.querySelector('[data-a=no]').onclick = () => closeTop();
    el.querySelector('[data-a=yes]').onclick = () => { done = true; closeTop(); resolve(true); };
  });
}
function promptBox(title, { label = '', value = '', type = 'text', ok = 'Save', hint = '' } = {}) {
  return new Promise(resolve => {
    let done = false;
    const el = modal({ title: esc(title), cls: 'small',
      body: `<div class="field"><label class="lbl">${esc(label)}</label>${type === 'textarea' ? `<textarea class="in" id="pb">${esc(value)}</textarea>` : `<input class="in" id="pb" type="${type}" value="${esc(value)}">`}${hint ? `<div class="hint">${hint}</div>` : ''}</div>`,
      footer: `<button class="btn ghost" data-a="no">Cancel</button><button class="btn" data-a="yes">${esc(ok)}</button>`,
      onClose: () => { if (!done) resolve(null); } });
    const inp = el.querySelector('#pb');
    const submit = () => { done = true; const v = inp.value; closeTop(); resolve(v); };
    el.querySelector('[data-a=no]').onclick = () => closeTop();
    el.querySelector('[data-a=yes]').onclick = submit;
    if (type !== 'textarea') inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    setTimeout(() => inp.focus(), 50);
  });
}

// ---------- pills for statuses ----------
const STATUS_COLORS = {
  green: ['Full Day', 'Approved', 'Received', 'Signed', 'Released', 'Done', 'Booked', 'Hired', 'Selected', 'Paid', 'Wrapped', 'Confirmed', 'Scheduled', 'Final Locked', 'TRUE'],
  amber: ['Partial Day', 'Pending', 'Requested', 'Review', 'In Progress', 'Waiting', 'Reviewing', 'Interview Invited', 'Interviewed', 'Offer', 'Shortlisted', 'In Edit', 'Sent', 'Unpaid', 'Needs Changes', 'High', 'Planned', 'Reimburse', 'Ordered', 'Approved '],
  red: ['No Show', 'Rejected', 'Missing', 'Pass', 'Declined', 'Urgent', 'Cancelled', 'Overdue'],
  blue: ['New', 'To Do', 'Not Started', 'Idea', 'Writing', 'Pre-production', 'Shooting', 'Post-production', 'Normal'],
  purple: ['Needs Role', 'On hold']
};
function pill(v) {
  if (!v) return '<span class="dim">—</span>';
  let color = '';
  for (const c in STATUS_COLORS) if (STATUS_COLORS[c].includes(v)) { color = c; break; }
  return `<span class="pill ${color}">${esc(v)}</span>`;
}
function stars(n, ro = true) {
  n = Number(n) || 0;
  return `<span class="stars ${ro ? 'ro' : ''}">${[1, 2, 3, 4, 5].map(i => `<button type="button" data-v="${i}" class="${i <= n ? 'on' : ''}" ${ro ? 'tabindex="-1"' : ''}>★</button>`).join('')}</span>`;
}

// Format any field value for display.
function display(f, v, row) {
  if (v == null || v === '') return '<span class="dim">—</span>';
  switch (f.t) {
    case 'date': return esc(fmtDate(v));
    case 'time': return esc(fmtTime(v));
    case 'money': return `<span class="mono">${money(v)}</span>`;
    case 'bool': return v === 'TRUE' ? '<span class="pill green">Yes</span>' : '<span class="dim">No</span>';
    case 'select': return pill(v);
    case 'rating': return stars(v);
    case 'url': { const u = safeUrl(v); return u ? `<a href="${esc(u)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(prettyUrl(u))}</a>` : esc(v); }
    case 'email': return `<a href="mailto:${esc(v)}" onclick="event.stopPropagation()">${esc(v)}</a>`;
    case 'phone': return `<a href="tel:${esc(String(v).replace(/[^\d+]/g, ''))}" onclick="event.stopPropagation()">${esc(v)}</a>`;
    case 'user': { const u = (S.boot.lookups.users || []).find(x => x.username === v); return esc(u ? u.name : '@' + v); }
    case 'longtext': return linkify(v);
    default: return esc(v);
  }
}
function prettyUrl(u) {
  try {
    const x = new URL(u);
    if (/drive\.google|docs\.google/.test(x.host)) return 'Open in Google ↗';
    if (/imdb/.test(x.host)) return 'IMDb ↗';
    if (/youtu/.test(x.host)) return 'YouTube ↗';
    if (/instagram/.test(x.host)) return 'Instagram ↗';
    return x.host.replace(/^www\./, '') + (x.pathname.length > 1 ? '/…' : '') + ' ↗';
  } catch (e) { return u; }
}

// ---------- router ----------
const VIEWS = {};       // name -> render(arg) function
function go(hash) { if (location.hash !== hash) location.hash = hash; else renderRoute(); }
function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  const [name, ...rest] = h.split('/');
  return { name: name || 'home', arg: decodeURIComponent(rest.join('/') || '') };
}
window.addEventListener('hashchange', () => { if (S.boot) renderRoute(); });
// Page loads take turns: if you tap somewhere new while a page is still
// loading, the newest page always renders last (no stale page on screen).
let routeBusy = false, routeAgain = false;
let routeSoft = true;
async function renderRoute(opts) {
  const soft = !!(opts && opts.soft);
  if (routeBusy) { routeAgain = true; routeSoft = routeSoft && soft; return; }
  routeBusy = true; routeSoft = soft;
  try { do { routeAgain = false; const s = routeSoft; routeSoft = true; await renderOnce(s); } while (routeAgain); }
  finally { routeBusy = false; }
}
// soft = a quiet refresh of the same page (live update): keep scroll, no loading skeleton.
async function renderOnce(soft) {
  const newRoute = parseHash();
  if (soft && S.route && (newRoute.name !== S.route.name || newRoute.arg !== S.route.arg)) soft = false;
  const keepY = window.scrollY;
  if (!soft) closeAll();
  S.route = newRoute;
  const { name, arg } = S.route;
  const main = $('#view');
  $('#side').classList.remove('open');
  const scrim = $('.side-scrim'); if (scrim) scrim.remove();
  highlightNav();
  if (!soft) window.scrollTo(0, 0);
  let fn = VIEWS[name];
  if (name === 'm') fn = VIEWS['m:' + arg] || VIEWS.generic;
  if (!fn) { main.innerHTML = `<div class="empty"><b>Page not found</b><a href="#/home">Go home</a></div>`; return; }
  const gate = { payroll: 'payroll', calendar: 'calendar' }[name];
  if ((name === 'm' && !modOf(arg)) || (gate && !modOf(gate)) || (name === 'admin' && !S.boot.isAdmin)) { main.innerHTML = `<div class="empty"><b>You don't have access to this section.</b>Ask your admin if you need it.</div>`; return; }
  if (!soft) main.innerHTML = skeleton();
  try { await fn(arg, main); if (soft) window.scrollTo(0, keepY); }
  catch (e) {
    if (e.message === 'SESSION_EXPIRED') return;
    main.innerHTML = `<div class="empty"><b>Couldn't load this page</b>${esc(e.message)}<div style="margin-top:14px"><button class="btn small ghost" onclick="renderRoute()">Try again</button></div></div>`;
  }
}
function skeleton() {
  return `<div class="topbar"><div class="sk" style="height:30px;width:220px"></div></div>
    <div class="grid g4 keep2" style="margin-bottom:14px">${'<div class="sk" style="height:86px"></div>'.repeat(4)}</div>
    <div class="sk" style="height:320px"></div>`;
}
function header(title, sub = '', actions = '') {
  return `<div class="topbar"><div><h1>${title}</h1></div><div class="spacer"></div>${actions}${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
}


/* ---------- live.js ---------- */
/* =====================================================================
   Live mode (Supabase): sign-in, fast reads, instant updates
   ---------------------------------------------------------------------
   The server says whether the hub runs on Supabase (action "config").
   If it does:
     • sign-in goes straight to Supabase (usernames work as before)
     • section lists are read straight from the database (fast, and the
       database itself only returns what this person is allowed to see)
     • when ANYONE changes anything, every open screen refreshes itself
   Saving still goes through the Apps Script (it runs the business rules,
   emails, calendar sync and activity log), so nothing about how things
   work changes — it just shows up for everyone right away.
   ===================================================================== */

const LIVE = { on: false, client: null, domain: 'hub.funarios.tv', channel: null, timer: null, dirty: new Set(), status: 'off' };
const LIVE_CONF_KEY = 'funhub_live_conf';

async function liveInit() {
  let conf = null;
  try { conf = JSON.parse(store.get(LIVE_CONF_KEY) || 'null'); } catch (e) {}
  try {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'config' }) });
    const out = await res.json();
    if (out && out.ok) { conf = out; store.set(LIVE_CONF_KEY, JSON.stringify(out)); }
  } catch (e) { /* offline: use the last known setup */ }
  if (!conf || conf.mode !== 'supabase' || !conf.supabaseUrl || !conf.supabaseKey) return false;
  for (let i = 0; i < 40 && !window.supabase; i++) await new Promise(r => setTimeout(r, 100));
  if (!window.supabase) throw new Error('Couldn\'t load the sign-in library. Check your internet connection and refresh.');
  LIVE.domain = conf.loginDomain || LIVE.domain;
  LIVE.client = window.supabase.createClient(conf.supabaseUrl, conf.supabaseKey, {
    auth: { persistSession: true, autoRefreshToken: true, storageKey: 'funhub_auth' },
    realtime: { params: { eventsPerSecond: 20 } }
  });
  LIVE.client.auth.onAuthStateChange((event, session) => {
    if (session) S.token = session.access_token;
    if (event === 'SIGNED_OUT' && S.boot) signOutLocal();
  });
  LIVE.on = true;
  store.del(TOKEN_KEY); // old-style sign-in token is no longer used
  return true;
}

async function liveToken() {
  const { data } = await LIVE.client.auth.getSession();
  return data && data.session ? data.session.access_token : null;
}

function liveLoginEmail(name) {
  name = String(name || '').trim();
  return name.includes('@') ? name.toLowerCase() : name.toLowerCase() + '@' + LIVE.domain;
}

async function liveSignIn(username, password) {
  const { data, error } = await LIVE.client.auth.signInWithPassword({ email: liveLoginEmail(username), password });
  if (error) {
    const m = String(error.message || '');
    if (/banned/i.test(m)) throw new Error('This account is turned off. Contact your admin.');
    if (/invalid login|invalid credentials|email not confirmed/i.test(m)) throw new Error('Wrong username or password.');
    if (/rate|too many/i.test(m)) throw new Error('Too many tries. Wait a few minutes, or ask your admin to reset your password.');
    throw new Error(m || 'Sign-in failed.');
  }
  S.token = data.session.access_token;
}

async function liveSignOut() {
  liveStop();
  try { await LIVE.client.auth.signOut(); } catch (e) {}
}

// ---------- reads ----------
async function liveRows(moduleKey) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await LIVE.client.from('records')
      .select('id,data,created_at,created_by,updated_at,updated_by')
      .eq('module', moduleKey).order('created_at', { ascending: true }).order('id', { ascending: true })
      .range(from, from + 999);
    if (error) throw new Error(/JWT|token/i.test(error.message) ? 'SESSION_EXPIRED' : error.message);
    data.forEach(r => out.push(Object.assign({}, r.data, { id: r.id, created_at: r.created_at, created_by: r.created_by, updated_at: r.updated_at, updated_by: r.updated_by })));
    if (data.length < 1000) break;
  }
  if (moduleKey === 'announcements' && !can('announcements', 'edit')) {
    const today = new Date().toLocaleDateString('en-CA', { timeZone: (S.boot && S.boot.settings.timezone) || 'America/New_York' });
    return out.filter(r => !r.expires || r.expires >= today);
  }
  return out;
}

// ---------- instant updates ----------
function liveStart() {
  if (!LIVE.on || LIVE.channel) return;
  LIVE.channel = LIVE.client.channel('hub-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'records' }, p => {
      const mod = (p.new && p.new.module) || (p.old && p.old.module);
      liveMark(mod || '*');
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'permissions' }, () => liveMark('#access'))
    .subscribe(status => { LIVE.status = status; liveBadge(); });
}
function liveStop() {
  if (LIVE.channel) { try { LIVE.client.removeChannel(LIVE.channel); } catch (e) {} }
  LIVE.channel = null; LIVE.status = 'off'; liveBadge();
}
function liveMark(what) {
  LIVE.dirty.add(what);
  clearTimeout(LIVE.timer);
  LIVE.timer = setTimeout(liveApply, 350);
}
// Which screens depend on which sections (computed pages read several).
const LIVE_DEPS = {
  home: '*', payroll: ['attendance', 'deliverables', 'people', 'role_rates', 'payments'],
  calendar: ['calendar', 'shoots', 'releases', 'tasks'], admin: ['activity']
};
function liveAffectsScreen(dirty) {
  if (dirty.has('*') || dirty.has('#access')) return true;
  const { name, arg } = S.route || {};
  if (name === 'm') return dirty.has(arg) || (arg === 'shoots' && dirty.has('attendance'));
  const deps = LIVE_DEPS[name];
  if (deps === '*') return true;
  return (deps || []).some(d => dirty.has(d));
}
async function liveApply() {
  if (!S.boot) { LIVE.dirty.clear(); return; }
  // Don't yank the page out from under someone who's typing or has a form open.
  const busy = stack.length || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && $('#view').contains(document.activeElement));
  if (busy) { clearTimeout(LIVE.timer); LIVE.timer = setTimeout(liveApply, 1500); return; }
  const dirty = new Set(LIVE.dirty); LIVE.dirty.clear();
  if (dirty.has('#access')) { try { S.boot = (await api('bootstrap', {}, { quiet: true })); buildNav(); } catch (e) {} }
  if (dirty.has('*') || dirty.has('#access')) S.cache = {}; else dirty.forEach(k => delete S.cache[k]);
  if (liveAffectsScreen(dirty)) renderRoute({ soft: true });
}
function liveBadge() {
  const el = $('#liveDot');
  if (!el) return;
  const on = LIVE.on && LIVE.status === 'SUBSCRIBED';
  el.classList.toggle('hidden', !LIVE.on);
  el.classList.toggle('on', on);
  el.title = on ? 'Live — changes from anyone show up instantly' : 'Reconnecting…';
}

// Which sections show in the phone's bottom bar (first 4 the user can see).

const NAV_ORDER = ['Production', 'Payroll', 'Casting', 'Content', 'Team', 'Money', 'Admin'];

function routeFor(key) {

  return special[key] || '#/m/' + key;
}

  const mods = S.boot.modules.filter(m => !m.hidden);

function initLogin() {
  const form = $('#loginForm');
  const btn = $('#loginBtn'), err = $('#loginErr');
  $('#pwToggle').onclick = () => { const p = $('#lp'); p.type = p.type === 'password' ? 'text' : 'password'; $('#pwToggle').textContent = p.type === 'password' ? 'Show' : 'Hide'; };
  form.addEventListener('submit', async e => {
    e.preventDefault();
    btn.disabled = true; btn.textContent = 'Signing in…'; err.textContent = '';
    try {
      if (LIVE.on) await liveSignIn($('#lu').value.trim(), $('#lp').value);
      else { const out = await api('login', { username: $('#lu').value.trim(), password: $('#lp').value }); S.token = out.token; store.set(TOKEN_KEY, out.token); }
      $('#lp').value = '';
      await boot();
    } catch (x) { err.textContent = x.message; }
    btn.disabled = false; btn.textContent = 'Sign in';
  });
  if (!API || /PASTE_YOUR/.test(API)) err.innerHTML = 'Setup step left: paste your Apps Script Web App URL into <b>index.html</b> (API_URL).';
}

async function start() {
  initLogin();
  $('#logoutBtn').onclick = async () => { if (!LIVE.on) { try { await api('logout', {}, { quiet: true }); } catch (e) {} } signOutLocal(); };
  $('#menuBtn').onclick = openSide;
  if (API && !/PASTE_YOUR/.test(API)) { try { await liveInit(); } catch (e) { $('#loginErr').textContent = e.message; } }
  const saved = LIVE.on ? await liveToken() : store.get(TOKEN_KEY);
  if (saved && API && !/PASTE_YOUR/.test(API)) {
    S.token = saved;
    $('#login').classList.add('hidden');
    $('#app').classList.remove('hidden');
    $('#view').innerHTML = skeleton();
    try { await boot(); } catch (e) { if (e.message !== 'SESSION_EXPIRED') { signOutLocal(); $('#loginErr').textContent = e.message; } }
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}


/* ---------- generic.js ---------- */
/* =====================================================================
   Generic section view: searchable/sortable table → detail drawer → form
   Every section uses this unless it has a custom view; sections can also
   add tweaks through MODCFG below.
   ===================================================================== */

const VS = {}; // per-section view state (search, filters, sort) survives re-renders

// Per-section tweaks. All optional.
const MODCFG = {
  calendar: { sort: ['date', 1], filters: ['type'] },
  shoots: { sort: ['date', -1], filters: ['status', 'production'], sub: 'Each shoot day: who\'s on set, call time, food. One click turns the cast list into attendance.' },
  attendance: { sort: ['date', -1], filters: ['status', 'role'] },
  deliverables: { sort: ['date_completed', -1], filters: ['status', 'editor'] },
  people: { sort: ['name', 1], filters: ['role', 'w9_status', 'contract_status'], sub: 'Everyone you pay — rates, contact info, W-9 and contract status.' },
  role_rates: { sort: ['role', 1], sub: 'Default pay per role. A person\'s own rate (People & Rates) wins over this.' },
  applicants: { sort: ['submitted', -1], filters: ['status'], sub: 'Producer / Production Coordinator applications from the public hiring page.' },
  productions: { sort: ['title', 1], filters: ['kind', 'stage'], sub: 'Series and one-offs — the list every other section picks from.' },
  releases: { sort: ['date', 1], filters: ['status', 'platform'], sub: 'Synced every hour from Darius\'s release calendar sheet (that sheet stays the source of truth).' },
  supplies: { sort: ['needed_by', 1], filters: ['status', 'kind'], sub: 'Studio supplies, props, wardrobe and shoot-day food requests.' },
  expenses: { sort: ['date', -1], filters: ['status', 'category'], sub: 'Vendor invoices and receipts.' },
  earnings: { sort: ['month', -1], filters: ['platform'] },
  announcements: { sort: ['created_at', -1] },
  documents: { sort: ['title', 1], filters: ['category'], sub: 'SOPs, forms, agreements, brand files — one place for every link the team needs.' },
  activity: { sort: ['ts', -1], filters: ['module', 'username'], sub: 'Every change anyone makes in the app.' },
  payments: { sort: ['paid_date', -1] },
  emails: { sort: ['ts', -1], filters: ['kind', 'sent_by'], sub: 'Every email the hub sent from casting@ — who, what and when.' }
};

function vstate(key) {
  if (!VS[key]) {
    const cfg = MODCFG[key] || {};
    VS[key] = { q: '', f: {}, sort: cfg.sort || ['created_at', -1], limit: 100 };
  }
  return VS[key];
}

function listCols(m) { return m.fields.filter(f => f.list && !f.hide); }

function rowMatches(m, r, st) {
  for (const k in st.f) if (st.f[k] && String(r[k] || '') !== st.f[k]) return false;
  if (!st.q) return true;
  const q = st.q.toLowerCase();
  return m.fields.some(f => String(r[f.k] || '').toLowerCase().includes(q));
}

function filterOptions(m, key, data) {
  const f = m.fields.find(x => x.k === key);
  if (!f) return [];
  if (Array.isArray(f.o)) return f.o;
  return uniq(data.map(r => r[key]).filter(Boolean)).sort(cmp);
}

VIEWS.generic = async function (key, main) {
  const m = modOf(key);
  const data = await rows(key);
  const st = vstate(key);
  const cfg = MODCFG[key] || {};
  const cols = listCols(m);
  const filters = (cfg.filters || []).filter(k => m.fields.some(f => f.k === k));
  const own = m.access === 'own';

  main.innerHTML = header(esc(m.label), esc(cfg.sub || (own ? 'Showing only your records.' : '')),
    (canCreate(key) ? `<button class="btn" id="addBtn">${icon('plus')}Add</button>` : '')) +
    (cfg.top ? `<div id="cfgTop"></div>` : '') +
    `<div class="toolbar">
      <div class="search">${icon('search')}<input class="in" id="q" placeholder="Search ${esc(m.label.toLowerCase())}…" value="${esc(st.q)}"></div>
      ${filters.map(k => {
        const f = m.fields.find(x => x.k === k);
        return `<select class="in" data-filter="${k}"><option value="">${esc(f.l.replace(/\s*\(.*\)/, ''))}: all</option>${filterOptions(m, k, data).map(o => `<option ${st.f[k] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
      }).join('')}
      <div class="spacer" style="flex:1"></div>
      <button class="btn ghost small" id="refresh" title="Refresh">${icon('refresh')}</button>
      <button class="btn ghost small" id="csv">${icon('download')}CSV</button>
    </div>
    <div id="tableArea"></div>`;

  const draw = () => {
    let list = data.filter(r => rowMatches(m, r, st));
    const [sk, sd] = st.sort;
    list.sort((a, b) => cmp(a[sk], b[sk]) * sd);
    const shown = list.slice(0, st.limit);
    const area = $('#tableArea');
    if (!list.length) {
      area.innerHTML = `<div class="empty"><b>${data.length ? 'Nothing matches' : 'Nothing here yet'}</b>${data.length ? 'Try a different search or filter.' : (canCreate(key) ? 'Click <b>Add</b> to create the first one.' : '')}</div>`;
      return;
    }
    const hasMoney = cols.filter(c => c.t === 'money');
    area.innerHTML = `<div class="table-wrap respond"><table class="tbl"><thead><tr>${cols.map(c =>
      `<th data-k="${c.k}" class="${c.t === 'money' || c.t === 'number' ? 'num' : ''} ${sk === c.k ? 'sorted' : ''}">${esc(c.l.replace(/\s*\(.*\)/, ''))} ${sk === c.k ? `<span class="arr">${sd > 0 ? '▲' : '▼'}</span>` : ''}</th>`).join('')}</tr></thead>
      <tbody>${shown.map(r => `<tr data-id="${esc(r.id)}">${cols.map(c => `<td class="${c.t === 'money' || c.t === 'number' ? 'num' : ''}"><span class="clip">${display(c, r[c.k], r)}</span></td>`).join('')}</tr>`).join('')}</tbody>
      ${hasMoney.length ? `<tfoot><tr>${cols.map((c, i) => c.t === 'money' ? `<td class="num">${money(list.reduce((s, r) => s + (Number(r[c.k]) || 0), 0))}</td>` : `<td>${i === 0 ? 'Total' : ''}</td>`).join('')}</tr></tfoot>` : ''}
      </table></div>
      <div class="cards-m">${shown.map(r => mobileCard(m, r, cols)).join('')}</div>
      <div class="table-foot"><span>${list.length} of ${data.length}</span>${list.length > st.limit ? `<button class="btn ghost small" id="moreRows">Show more</button>` : ''}</div>`;
    $$('#tableArea [data-id]').forEach(tr => tr.onclick = () => openDetail(key, data.find(r => r.id === tr.dataset.id)));
    $$('#tableArea th[data-k]').forEach(th => th.onclick = () => {
      st.sort = st.sort[0] === th.dataset.k ? [th.dataset.k, -st.sort[1]] : [th.dataset.k, 1];
      draw();
    });
    const more = $('#moreRows'); if (more) more.onclick = () => { st.limit += 200; draw(); };
  };
  draw();

  $('#q').addEventListener('input', debounce(e => { st.q = e.target.value.trim(); st.limit = 100; draw(); }, 150));
  $$('[data-filter]').forEach(s => s.onchange = () => { st.f[s.dataset.filter] = s.value; draw(); });
  $('#refresh').onclick = async () => { await rows(key, true); renderRoute(); };
  $('#csv').onclick = () => {
    const list = data.filter(r => rowMatches(m, r, st));
    const allCols = m.fields.filter(f => !f.hide);
    download(`${key}-${todayIso()}.csv`, toCsv(list, allCols));
  };
  const add = $('#addBtn'); if (add) add.onclick = () => openForm(key, null, cfg.defaults ? cfg.defaults() : {});
  if (cfg.top) cfg.top($('#cfgTop'), data);
};

function mobileCard(m, r, cols) {
  const titleCol = cols.find(c => ['text', 'person', 'email'].includes(c.t)) || cols[0];
  const statusCol = cols.find(c => c.t === 'select');
  const rest = cols.filter(c => c !== titleCol && c !== statusCol).slice(0, 4);
  return `<div class="mcard" data-id="${esc(r.id)}"><div class="row1"><span class="t">${esc(r[titleCol.k] || '—')}</span>${statusCol ? display(statusCol, r[statusCol.k]) : ''}</div>
    <div class="meta">${rest.filter(c => r[c.k]).map(c => `<span>${c.t === 'select' || c.t === 'rating' ? display(c, r[c.k]) : c.t === 'bool' ? (r[c.k] === 'TRUE' ? '✓ ' + esc(c.l.replace(/\s*\(.*\)/, '')) : '') : esc(c.l.replace(/\s*\(.*\)/, '')) + ': ' + display(c, r[c.k])}</span>`).join('')}</div></div>`;
}

// ---------- detail drawer ----------
const DETAIL_ACTIONS = {}; // key -> (row, footerEl, close) => void   (custom buttons)
const DETAIL_EXTRA = {};   // key -> row => html (shown above the fields)
const DETAIL_WIRE = {};    // key -> (row, drawerEl) => void (hook up controls from DETAIL_EXTRA)

function openDetail(key, row) {
  if (!row) return;
  const m = modOf(key);
  const fields = m.fields.filter(f => !f.hide);
  const titleF = fields.find(f => ['text', 'person'].includes(f.t) && row[f.k]) || fields[0];
  const body = document.createElement('div');
  body.innerHTML = (DETAIL_EXTRA[key] ? DETAIL_EXTRA[key](row) : '') +
    `<dl class="kv">${fields.filter(f => row[f.k] !== '' && row[f.k] != null).map(f => `<dt>${esc(f.l)}</dt><dd>${display(f, row[f.k], row)}</dd>`).join('')}</dl>
    <div class="section-title">Record</div>
    <div class="tiny dim">Added ${esc(fmtStamp(row.created_at))}${row.created_by ? ' by ' + esc(row.created_by) : ''}${row.updated_at && row.updated_at !== row.created_at ? ` · Last changed ${esc(fmtStamp(row.updated_at))} by ${esc(row.updated_by)}` : ''}</div>`;
  const foot = document.createElement('div');
  foot.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;width:100%;justify-content:flex-end';
  const el = drawer({ title: esc(row[titleF.k] || m.label), body, footer: foot });
  if (DETAIL_ACTIONS[key]) DETAIL_ACTIONS[key](row, foot);
  if (DETAIL_WIRE[key]) DETAIL_WIRE[key](row, el);
  if (can(key, 'full') && !m.readonly) {
    const del = document.createElement('button');
    del.className = 'btn danger small'; del.textContent = 'Delete'; del.style.marginRight = 'auto';
    del.onclick = async () => {
      if (!(await confirmBox(`Delete this ${esc(m.label.toLowerCase().replace(/s$/, ''))}? This can't be undone.`, { ok: 'Delete', danger: true }))) return;
      try { await api('remove', { module: key, id: row.id }); patchCache(key, null, row.id); toast('Deleted', 'ok'); closeAll(); renderRoute(); } catch (e) { fail(e); }
    };
    foot.prepend(del);
  }
  if (canEditRow(key, row)) {
    const ed = document.createElement('button');
    ed.className = 'btn small'; ed.textContent = 'Edit';
    ed.onclick = () => openForm(key, row);
    foot.appendChild(ed);
  }
  return el;
}

function fmtStamp(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return s;
  return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

// ---------- form ----------
function inputFor(f, v, key) {
  const name = `name="${f.k}"`;
  v = v == null ? '' : v;
  switch (f.t) {
    case 'longtext': return `<textarea class="in" ${name}>${esc(v)}</textarea>`;
    case 'number': return `<input class="in" type="number" step="any" inputmode="decimal" ${name} value="${esc(v)}">`;
    case 'money': return `<input class="in" type="number" step="0.01" min="0" inputmode="decimal" ${name} value="${esc(v)}" placeholder="0.00">`;
    case 'date': return `<input class="in" type="date" ${name} value="${esc(v)}">`;
    case 'time': return `<input class="in" type="time" ${name} value="${esc(v)}">`;
    case 'email': return `<input class="in" type="email" ${name} value="${esc(v)}">`;
    case 'phone': return `<input class="in" type="tel" ${name} value="${esc(v)}">`;
    case 'url': return `<input class="in" type="url" ${name} value="${esc(v)}" placeholder="https://">`;
    case 'bool': return `<label class="toggle"><input type="checkbox" ${name} ${v === 'TRUE' ? 'checked' : ''}> Yes</label>`;
    case 'rating': return `<div data-rating="${f.k}">${stars(v, false)}<input type="hidden" ${name} value="${esc(v)}"></div>`;
    case 'select': {
      const opts = (f.o || []).slice();
      if (v && !opts.includes(v)) opts.unshift(v);
      return `<select class="in" ${name}><option value=""></option>${opts.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    }
    case 'multiselect': {
      const cur = String(v).split(',').map(s => s.trim()).filter(Boolean);
      return `<div class="ms" data-ms="${f.k}">${(f.o || []).map(o => `<label><input type="checkbox" value="${esc(o)}" ${cur.includes(o) ? 'checked' : ''}>${esc(o)}</label>`).join('')}</div>`;
    }
    case 'person': {
      const list = (S.boot.lookups.people || []);
      return `<input class="in" ${name} value="${esc(v)}" list="dl-people" autocomplete="off" placeholder="Start typing a name…">`;
    }
    case 'production': return `<input class="in" ${name} value="${esc(v)}" list="dl-prod" autocomplete="off">`;
    case 'user': {
      const users = S.boot.lookups.users || [];
      return `<select class="in" ${name}><option value=""></option>${users.map(u => `<option value="${esc(u.username)}" ${u.username === v ? 'selected' : ''}>${esc(u.name)} (@${esc(u.username)})</option>`).join('')}</select>`;
    }
    default: return `<input class="in" ${name} value="${esc(v)}">`;
  }
}

function datalists() {
  return `<datalist id="dl-people">${(S.boot.lookups.people || []).map(p => `<option value="${esc(p.name)}">${esc(p.role || '')}</option>`).join('')}</datalist>
    <datalist id="dl-prod">${(S.boot.lookups.productions || []).map(p => `<option value="${esc(p)}">`).join('')}</datalist>`;
}

function openForm(key, row, defaults = {}, opts = {}) {
  const m = modOf(key);
  const editing = !!row;
  const ownOnly = m.access === 'own';
  let fields = m.fields.filter(f => !f.hide && !f.ro);
  if (ownOnly) fields = fields.filter(f => m.ownEditable.includes(f.k));
  if (opts.only) fields = fields.filter(f => opts.only.includes(f.k));
  const base = Object.assign({}, defaults, row || {});
  const wide = f => ['longtext', 'multiselect'].includes(f.t) || f.l.length > 34;
  const body = document.createElement('form');
  body.innerHTML = datalists() + `<div class="form-grid">${fields.map(f =>
    `<div class="field ${wide(f) ? 'wide' : ''}"><label class="lbl ${f.req ? 'req' : ''}">${esc(f.l)}</label>${inputFor(f, base[f.k], key)}</div>`).join('')}</div>
    <div class="err" id="formErr"></div><button type="submit" class="hidden"></button>`;
  const foot = `<button type="button" class="btn ghost" data-a="cancel">Cancel</button><button type="button" class="btn" data-a="save">${editing ? 'Save changes' : (opts.saveLabel || 'Add')}</button>`;
  const el = modal({ title: esc(opts.title || (editing ? 'Edit' : 'Add') + ' — ' + m.label), body, footer: foot });
  $$('[data-rating]', el).forEach(w => {
    $$('button', w).forEach(b => b.onclick = () => {
      const cur = w.querySelector('input').value;
      const v = cur === b.dataset.v ? '' : b.dataset.v;
      w.querySelector('input').value = v;
      $$('button', w).forEach(x => x.classList.toggle('on', v && Number(x.dataset.v) <= Number(v)));
    });
  });
  const save = async () => {
    const data = {};
    fields.forEach(f => {
      if (f.t === 'multiselect') { data[f.k] = $$(`[data-ms="${f.k}"] input:checked`, el).map(i => i.value).join(', '); return; }
      const inp = el.querySelector(`[name="${f.k}"]`);
      if (!inp) return;
      data[f.k] = f.t === 'bool' ? (inp.checked ? 'TRUE' : 'FALSE') : inp.value.trim();
    });
    if (editing) Object.keys(data).forEach(k => { if (String(data[k]) === String(row[k] || '') ) delete data[k]; });
    if (!editing) Object.keys(defaults).forEach(k => { if (!(k in data)) data[k] = defaults[k]; });
    const missing = fields.find(f => f.req && !String(data[f.k] != null ? data[f.k] : (row && row[f.k]) || '').trim());
    if (missing) { $('#formErr', el).textContent = missing.l + ' is required.'; return; }
    const btn = el.querySelector('[data-a=save]');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      let out;
      if (editing) {
        if (!Object.keys(data).length) { closeAll(); return; }
        out = await api('update', { module: key, id: row.id, data });
      } else out = await api('create', { module: key, data });
      patchCache(key, out.row);
      if (key === 'people' || key === 'productions') refreshLookups();
      toast(editing ? 'Saved' : 'Added', 'ok');
      closeAll();
      if (opts.after) opts.after(out.row); else renderRoute();
    } catch (e) {
      $('#formErr', el).textContent = e.message;
      btn.disabled = false; btn.textContent = editing ? 'Save changes' : (opts.saveLabel || 'Add');
    }
  };
  el.querySelector('[data-a=save]').onclick = save;
  el.querySelector('[data-a=cancel]').onclick = closeTop;
  body.addEventListener('submit', e => { e.preventDefault(); save(); });
  return el;
}

async function refreshLookups() {
  try { const out = await api('bootstrap', {}, { quiet: true }); S.boot.lookups = out.lookups; S.boot.modules = out.modules; } catch (e) {}
}

    ${rel.next7.length ? `<div class="section-title">Dropping this week</div><div class="list">${rel.next7.map(r => `<div class="li"><div class="when">${esc(relDay(r.date).slice(0, 3))}<b>${isoToDate(r.date).getUTCDate()}</b></div><div class="body"><div class="t">${esc(r.show)}</div><div class="m">${esc(r.platform)} ${esc(r.type)} · ${pill(r.status)}</div></div></div>`).join('')}</div>` : ''}
  </div>` : '';

  // ---- my tasks ----
  const tasks = c.myTasks;
  const taskCard = tasks ? `<div class="card"><h3>${icon('list')} My tasks <a class="more" href="#/m/tasks">All tasks →</a></h3>
    ${tasks.length ? `<div class="list">${tasks.map(t => {
      const late = t.due_date && t.due_date < h.today;
      return `<div class="li"><span class="dot ${late ? 'red' : t.priority === 'Urgent' || t.priority === 'High' ? 'amber' : 'blue'}"></span><div class="body"><div class="t">${esc(t.title)}</div><div class="m">${t.due_date ? (late ? '<span style="color:var(--red2)">Overdue · </span>' : 'Due ') + esc(relDay(t.due_date)) + ' · ' : ''}${pill(t.status)}</div></div></div>`;

  const annCard = ann && ann.length ? `<div class="card"><h3>${icon('megaphone')} Announcements <a class="more" href="#/m/announcements">All →</a></h3>
    <div class="list">${ann.map(a => `<div class="li"><span class="dot ${a.pinned === 'TRUE' ? 'red' : 'blue'}"></span><div class="body"><div class="t">${a.pinned === 'TRUE' ? '📌 ' : ''}${esc(a.title)}</div><div class="m" style="white-space:pre-wrap">${linkify(a.body)}</div></div></div>`).join('')}</div></div>` : '';

  if (canCreate('deliverables')) qa.push(`<button class="btn soft small" data-act="submitVideo">${icon('film')}Submit a video</button>`);
  if (canCreate('shoots')) qa.push(`<button class="btn soft small" data-act="newShoot">${icon('clapper')}New shoot day</button>`);
  if (canCreate('supplies')) qa.push(`<button class="btn soft small" data-act="newSupply">${icon('box')}Request supplies</button>`);
  if (canCreate('calendar')) qa.push(`<button class="btn soft small" data-act="newEvent">${icon('calendar')}Add event</button>`);
  if (canCreate('tasks')) qa.push(`<button class="btn soft small" data-act="newTask">${icon('list')}New task</button>`);

  main.innerHTML = `
    <div class="topbar"><div><h1>${esc(greet)}, ${esc(first)}</h1><div class="muted small" style="margin-top:4px">${esc(fmtDate(h.today, { dow: true, year: true }))}</div></div></div>

    newSupply: () => openForm('supplies', null, {}, { title: 'Request supplies or food', saveLabel: 'Send request', after: () => renderRoute() }),

};


/* ---------- attendance.js ---------- */
/* =====================================================================
   Attendance — mark who worked each shoot day (Full / Partial / No Show)
   ===================================================================== */

const ATT = { date: null, table: false };

VIEWS['m:attendance'] = async function (_, main) {
  if (!can('attendance', 'edit') || ATT.table) return VIEWS.generic('attendance', main);
  const [all, shoots] = await Promise.all([rows('attendance'), can('shoots') ? rows('shoots') : Promise.resolve([])]);
  const today = todayIso();
  const dates = uniq(all.map(r => r.date).concat(shoots.filter(s => s.status !== 'Cancelled').map(s => s.date))).sort();
  if (!ATT.date) {
    const past = dates.filter(d => d <= today);
    ATT.date = dates.includes(today) ? today : (past.length ? past[past.length - 1] : (dates[0] || today));
  }
  const roles = (fieldOf('attendance', 'role') || {}).o || [];

  const draw = () => {
    const d = ATT.date;
    const list = all.filter(r => r.date === d).sort((a, b) => cmp(a.person, b.person));
    const shoot = shoots.find(s => s.date === d && s.status !== 'Cancelled');
    const idx = dates.indexOf(d);
    const prev = idx > 0 ? dates[idx - 1] : dates.filter(x => x < d).pop();
    const next = idx >= 0 ? dates[idx + 1] : dates.find(x => x > d);
    const cnt = { full: 0, partial: 0, no: 0, open: 0 };
    list.forEach(r => { if (r.status === 'Full Day') cnt.full++; else if (r.status === 'Partial Day') cnt.partial++; else if (r.status === 'No Show') cnt.no++; else cnt.open++; });

    main.innerHTML = header('Attendance', 'Mark everyone who was on set. Partial days and no-shows need a note.',
      `<button class="btn ghost small" id="tblView">${icon('table')}Table view</button><button class="btn" id="addP">${icon('plus')}Add person</button>`) +
      `<div class="toolbar datebar">
        <button class="btn ghost small" id="prevD" ${prev ? '' : 'disabled'}>${icon('chevL')}</button>
        <input type="date" class="in" id="pickD" value="${esc(d)}">
        <button class="btn ghost small" id="nextD" ${next ? '' : 'disabled'}>${icon('chevR')}</button>
        <button class="btn ghost small" id="todayD">Today</button>
        <div style="flex:1"></div>
        <span class="pill green">${cnt.full} full</span><span class="pill amber">${cnt.partial} partial</span><span class="pill red">${cnt.no} no-show</span>${cnt.open ? `<span class="pill">${cnt.open} not marked</span>` : ''}
      </div>
      ${shoot ? `<div class="banner blue"><div style="flex:1"><b>${esc(fmtDate(d, { dow: true }))}</b> — ${esc([shoot.production, shoot.title].filter(Boolean).join(' · ') || 'Shoot day')}${shoot.call_time ? ' · call ' + esc(fmtTime(shoot.call_time)) : ''}${shoot.location ? ' · ' + esc(shoot.location) : ''}</div>
        ${shoot.cast_list ? `<button class="btn small blue" id="fromShoot">Pull in call-sheet names</button>` : ''}</div>` : ''}
      ${list.length ? `<div class="table-wrap">${list.map(r => attRow(r, roles)).join('')}</div>`
        : `<div class="empty"><b>No one logged for ${esc(fmtDate(d, { dow: true }))}</b>${shoot && shoot.cast_list ? 'Pull the names in from the shoot\'s call sheet, or add people one by one.' : 'Add people one by one, or create a Shoot Day with a cast list first.'}</div>`}`;

    $('#prevD').onclick = () => { if (prev) { ATT.date = prev; draw(); } };
    $('#nextD').onclick = () => { if (next) { ATT.date = next; draw(); } };
    $('#todayD').onclick = () => { ATT.date = today; draw(); };
    $('#pickD').onchange = e => { if (e.target.value) { ATT.date = e.target.value; draw(); } };
    $('#tblView').onclick = () => { ATT.table = true; renderRoute(); };
    $('#addP').onclick = () => openForm('attendance', null, { date: d, production: shoot ? shoot.production : '' }, { after: () => draw() });
    const fs = $('#fromShoot');
    if (fs) fs.onclick = async () => {
      fs.disabled = true;
      try {
        const r = await api('shootToAttendance', { shootId: shoot.id });
        toast(`${r.result.added} added${r.result.skipped ? `, ${r.result.skipped} already there` : ''}`, 'ok');
        const fresh = await rows('attendance', true);
        all.length = 0; fresh.forEach(x => all.push(x));
        refreshLookups();
        draw();
      } catch (e) { fail(e); fs.disabled = false; }
    };
    $$('.att-row', main).forEach(el => wireAttRow(el, all, draw));
  };
  draw();
};

function attRow(r, roles) {
  const st = r.status === 'Full Day' ? 'full' : r.status === 'Partial Day' ? 'partial' : r.status === 'No Show' ? 'no' : '';
  const opts = roles.includes(r.role) ? roles : [r.role].concat(roles);
  return `<div class="att-row ${st ? 'st-' + st : ''}" data-id="${esc(r.id)}">
    <div class="name">${esc(r.person)}<small>${esc(r.production || '')}</small></div>
    <div class="rolecell"><select class="in" data-role style="padding:7px 8px">${opts.map(o => `<option ${o === r.role ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></div>
    <div class="seg"><button data-st="Full Day" class="${st === 'full' ? 'on full' : ''}">Full</button><button data-st="Partial Day" class="${st === 'partial' ? 'on partial' : ''}">Partial</button><button data-st="No Show" class="${st === 'no' ? 'on no' : ''}">No show</button></div>
    <div class="other small">${r.status === 'Partial Day' ? `<b>${money(r.partial_amount)}</b> · ` : ''}${r.note ? esc(r.note) : r.rate_override ? 'Rate: ' + money(r.rate_override) : '<span class="dim">—</span>'}</div>
    <button class="x xbtn" title="More" data-more>⋯</button>
  </div>`;
}

function wireAttRow(el, all, redraw) {
  const id = el.dataset.id;
  const row = () => all.find(r => r.id === id);
  const save = async (data) => {
    el.style.opacity = '.6';
    try {
      const out = await api('update', { module: 'attendance', id, data });
      Object.assign(row(), out.row);
      patchCache('attendance', out.row);
      redraw();
    } catch (e) { fail(e); el.style.opacity = '1'; }
  };
  $$('[data-st]', el).forEach(b => b.onclick = async () => {
    const r = row();
    const st = b.dataset.st;
    if (r.status === st) { // tap again = clear
      if (await confirmBox(`Clear ${esc(r.person)}'s status for this day?`, { ok: 'Clear', title: 'Clear status' })) save({ status: '', partial_amount: '', note: '' });
      return;
    }
    if (st === 'Full Day') return save({ status: st, partial_amount: '' });
    if (st === 'No Show') {
      const note = await promptBox(`${r.person} — no show`, { label: 'What happened? (required)', value: r.note || '', ok: 'Mark no-show' });
      if (note == null) return;
      if (!note.trim()) return toast('A note is required for no-shows.', 'err');
      return save({ status: st, note: note.trim(), partial_amount: '' });
    }
    partialDialog(r, save);
  });
  $('[data-role]', el).onchange = e => save({ role: e.target.value });
  $('[data-more]', el).onclick = () => openDetail('attendance', row());
}

function partialDialog(r, save) {
  const el = modal({ title: esc(r.person) + ' — partial day', cls: 'small',
    body: `<div class="field"><label class="lbl req">Pay for the day</label><input class="in" id="pAmt" type="number" step="0.01" inputmode="decimal" value="${esc(r.partial_amount || '')}" placeholder="e.g. 75"></div>
      <div class="field"><label class="lbl req">Note</label><input class="in" id="pNote" value="${esc(r.note || '')}" placeholder="e.g. left at 2pm"></div><div class="err" id="pErr"></div>`,
    footer: `<button class="btn ghost" data-a="no">Cancel</button><button class="btn" data-a="yes">Mark partial</button>` });
  el.querySelector('[data-a=no]').onclick = closeTop;
  el.querySelector('[data-a=yes]').onclick = () => {
    const amt = $('#pAmt', el).value.trim(), note = $('#pNote', el).value.trim();
    if (!amt || !note) { $('#pErr', el).textContent = 'Both the amount and a note are required.'; return; }
    closeTop();
    save({ status: 'Partial Day', partial_amount: amt, note });
  };
}

// Back to the day view from the table view.
MODCFG.attendance.top = (box) => {
  if (!can('attendance', 'edit')) return;
  box.innerHTML = `<div style="margin:-6px 0 14px"><button class="btn ghost small" id="dayView">${icon('check')}Back to day-by-day marking</button></div>`;
  $('#dayView').onclick = () => { ATT.table = false; renderRoute(); };
};

      p.own ? 'Your days and approved videos for each pay period.' : `Pay period ${esc(p.period.label)} · summary due ${esc(fmtDate(p.dueDate, { dow: true }))}`,
      `<select class="in no-print" id="per" style="width:auto">${p.periods.map(x => `<option value="${x.key}" ${x.key === p.period.key ? 'selected' : ''}>${esc(x.label)}</option>`).join('')}</select>
       ${p.own ? '' : `<button class="btn ghost small no-print" id="csvBtn">${icon('download')}CSV</button><button class="btn small no-print" id="printBtn">${icon('print')}Print / PDF</button>`}`) +
      `<div class="print-only" style="margin-bottom:14px"><h2 style="margin:0">${esc(S.boot.settings.app_name || 'FUNarios')} — Payroll Summary</h2><div>${esc(p.period.label)} · generated ${esc(new Date().toLocaleString())}</div></div>
      <div class="hero">
        <div class="stat blue big"><div class="n">${money(p.total)}</div><div class="l">${p.own ? 'My total' : 'Total payroll'}</div><div class="s">${esc(p.period.label)}</div></div>
        <div class="stat green"><div class="n">${money(p.paidTotal)}</div><div class="l">Paid so far</div><div class="s">${p.own ? '' : unpaid.length + ' still to pay'}</div></div>
        <div class="stat"><div class="n">${p.people.reduce((s, x) => s + x.days, 0)}</div><div class="l">Full days</div><div class="s">${p.people.reduce((s, x) => s + x.partial, 0)} partial · ${p.people.reduce((s, x) => s + x.noShow, 0)} no-show</div></div>
        <div class="stat"><div class="n">${p.people.reduce((s, x) => s + x.videos, 0)}</div><div class="l">Approved videos</div><div class="s">${p.people.reduce((s, x) => s + x.pendingVideos, 0)} pending approval</div></div>
      </div>
      ${p.flags.length ? `<div class="banner no-print"><div><b>Check before sending (${p.flags.length})</b><ul style="margin:6px 0 0;padding-left:18px">${p.flags.slice(0, 12).map(f => `<li>${esc(f.text)}</li>`).join('')}</ul>${p.flags.length > 12 ? `<div class="tiny muted">…and ${p.flags.length - 12} more</div>` : ''}</div></div>` : ''}
      ${p.people.length ? `<div class="table-wrap"><table class="tbl" id="payTbl"><thead><tr>
          <th>Name</th><th class="num">Days</th><th class="num">Day pay</th><th class="num">Videos</th><th class="num">Video pay</th><th class="num">Total</th><th>Status</th>${p.canPay ? '<th class="no-print"></th>' : ''}
        </tr></thead><tbody>${p.people.map((x, i) => payRow(x, i, p, open[x.name])).join('')}</tbody>
        <tfoot><tr><td>Total</td><td class="num">${p.people.reduce((s, x) => s + x.days, 0)}</td><td class="num">${money(p.people.reduce((s, x) => s + x.dayPay, 0))}</td><td class="num">${p.people.reduce((s, x) => s + x.videos, 0)}</td><td class="num">${money(p.people.reduce((s, x) => s + x.videoPay, 0))}</td><td class="num">${money(p.total)}</td><td></td>${p.canPay ? '<td class="no-print"></td>' : ''}</tr></tfoot>
        </table></div>
        <div class="tiny muted" style="margin-top:8px">Tap a name to see every day and video behind the total.</div>`
      : `<div class="empty"><b>No pay in this period yet</b>${p.own ? 'Once your days are marked or your videos are approved, they show up here.' : 'Mark attendance or approve editor deliverables and they show up here.'}</div>`}`;

    $('#per').onchange = e => { PAY_PERIOD = e.target.value; renderRoute(); };
    const pb = $('#printBtn'); if (pb) pb.onclick = () => { Object.keys(open).forEach(k => delete open[k]); draw(); setTimeout(() => window.print(), 50); };
    const cb = $('#csvBtn'); if (cb) cb.onclick = () => {
      const cols = [{ k: 'date', l: 'Date' }, { k: 'person', l: 'Name' }, { k: 'role', l: 'Role' }, { k: 'production', l: 'Production' }, { k: 'what', l: 'Day / Video' }, { k: 'status', l: 'Status' }, { k: 'rate', l: 'Rate' }, { k: 'owed', l: 'Owed' }, { k: 'note', l: 'Note' }];
      download(`payroll-${p.period.key}.csv`, toCsv(p.lines.map(l => ({ ...l, what: l.kind === 'video' ? l.title : 'Day' })), cols));
    };
    $$('#payTbl tbody tr.pr').forEach(tr => tr.onclick = e => {
      if (e.target.closest('button')) return;

  draw();

function payRow(x, i, p, isOpen) {
  const lines = p.lines.filter(l => l.person === x.name);
  const status = x.paid ? `<span class="paid-yes">Paid ${money(x.paid.amount)}</span><div class="tiny muted">${esc(fmtDate(x.paid.date))}${x.paid.method ? ' · ' + esc(x.paid.method) : ''}</div>`
    : x.total > 0 ? '<span class="pill amber">Unpaid</span>' : '<span class="dim">—</span>';
  const extra = [x.partial ? x.partial + ' partial' : '', x.noShow ? x.noShow + ' no-show' : '', x.unmarked ? x.unmarked + ' not marked' : '', x.pendingVideos ? x.pendingVideos + ' video pending' : ''].filter(Boolean).join(' · ');
  return `<tr class="pr" data-name="${esc(x.name)}"><td><b>${esc(x.name)}</b>${extra ? `<div class="tiny muted">${esc(extra)}</div>` : ''}</td>
    <td class="num">${x.days || ''}</td><td class="num">${x.dayPay ? money(x.dayPay) : ''}</td><td class="num">${x.videos || ''}</td><td class="num">${x.videoPay ? money(x.videoPay) : ''}</td>
    <td class="num"><b>${money(x.total)}</b></td><td>${status}</td>
    ${p.canPay ? `<td class="no-print" style="text-align:right">${x.paid ? `<button class="btn ghost tiny" data-unpay="${i}">Undo</button>` : x.total > 0 ? `<button class="btn green tiny" data-pay="${i}">Mark paid</button>` : ''}</td>` : ''}</tr>
    ${isOpen ? `<tr><td colspan="${p.canPay ? 8 : 7}" style="padding:0"><div class="lines"><table>${lines.map(l => `<tr><td>${esc(fmtDate(l.date, { dow: true }))}</td><td>${l.kind === 'video' ? '🎬 ' + esc(l.title) : esc(l.role)}</td><td>${esc(l.production || '')}</td><td>${pill(l.status || 'Not marked')}</td><td class="num">${l.kind === 'day' && l.rate != null ? 'rate ' + money(l.rate) : ''}</td><td class="num"><b>${money(l.owed)}</b></td><td class="muted">${esc(l.note || '')}</td></tr>`).join('')}</table></div></td></tr>` : ''}`;
}

function payDialog(p, x) {
  const methods = ['Zelle', 'Cash App', 'Venmo', 'PayPal', 'Check', 'Cash', 'Direct deposit', 'Other'];
  const el = modal({ title: 'Mark ' + esc(x.name) + ' paid', cls: 'small',
    body: `<div class="field"><label class="lbl">Amount</label><input class="in" id="pmA" type="number" step="0.01" value="${x.total}"></div>
      <div class="field"><label class="lbl">Paid on</label><input class="in" id="pmD" type="date" value="${todayIso()}"></div>
      <div class="field"><label class="lbl">Method</label><select class="in" id="pmM"><option></option>${methods.map(m => `<option>${m}</option>`).join('')}</select></div>
      <div class="field"><label class="lbl">Reference # (optional)</label><input class="in" id="pmR"></div><div class="err" id="pmE"></div>`,
    footer: `<button class="btn ghost" data-a="no">Cancel</button><button class="btn green" data-a="yes">Mark paid</button>` });
  el.querySelector('[data-a=no]').onclick = closeTop;
  el.querySelector('[data-a=yes]').onclick = async () => {
    try {
      await api('markPaid', { period: p.period.key, person: x.name, amount: $('#pmA', el).value, paidDate: $('#pmD', el).value, method: $('#pmM', el).value, reference: $('#pmR', el).value });
      closeAll(); toast(x.name + ' marked paid', 'ok'); renderRoute();
    } catch (e) { $('#pmE', el).textContent = e.message; }
  };
}
