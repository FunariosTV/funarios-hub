const TAL = { sel: new Set(), view: 'grid' };

VIEWS['m:talent'] = async function (_, main) {
  if (TAL.view === 'table') return VIEWS.generic('talent', main);
  const data = await rows('talent');
  const st = vstate('talent');
  if (!st.sortSet) { st.sort = ['submitted', -1]; st.sortSet = true; }
  const m = modOf('talent');
  const statuses = fieldOf('talent', 'status').o;
  const editable = can('talent', 'edit');

  main.innerHTML = header('Actor Submissions', `Everyone who submitted through the public actor form${S.boot.settings.actor_form_url ? ` (<a href="${esc(safeUrl(S.boot.settings.actor_form_url))}" target="_blank" rel="noopener">open form ↗</a>)` : ''}. New submissions sync in every hour.`,
    `<button class="btn ghost small" id="tblV">${icon('table')}Table</button>${canCreate('talent') ? `<button class="btn" id="addT">${icon('plus')}Add</button>` : ''}`) +
    `<div class="toolbar">
      <div class="search">${icon('search')}<input class="in" id="q" placeholder="Search name, skills, IG…" value="${esc(st.q)}"></div>
      <div class="chips" id="stChips"><button class="chip ${!st.f.status ? 'on' : ''}" data-s="">All</button>${statuses.map(s => `<button class="chip ${st.f.status === s ? 'on' : ''}" data-s="${esc(s)}">${esc(s)} <span class="dim">${data.filter(r => r.status === s).length}</span></button>`).join('')}</div>
      <select class="in" id="atl"><option value="">Anywhere</option><option value="Yes" ${st.f.in_atlanta === 'Yes' ? 'selected' : ''}>In Atlanta</option></select>
      <select class="in" id="srt"><option value="submitted|-1">Newest first</option><option value="submitted|1">Oldest first</option><option value="rating|-1">Top rated</option><option value="full_name|1">Name A–Z</option></select>
    </div>
    <div id="gal"></div><div id="selbar"></div>`;
  $('#srt').value = st.sort.join('|');

  const draw = () => {
    let list = data.filter(r => rowMatches(m, r, st));
    list.sort((a, b) => cmp(a[st.sort[0]], b[st.sort[0]]) * st.sort[1]);
    const shown = list.slice(0, st.limit);
    $('#gal').innerHTML = list.length ? `<div class="gallery">${shown.map(r => talentCard(r)).join('')}</div>
      <div class="table-foot"><span>${list.length} of ${data.length}</span>${list.length > st.limit ? '<button class="btn ghost small" id="moreT">Show more</button>' : ''}</div>`
      : `<div class="empty"><b>${data.length ? 'No one matches' : 'No submissions yet'}</b>${data.length ? 'Try another filter.' : (S.boot.isAdmin ? 'Go to Users &amp; Access → Import to pull in the existing submissions.' : '')}</div>`;
    $$('.tcard', main).forEach(c => {
      c.onclick = e => {
        if (e.target.closest('.ck') || TAL.sel.size) { toggleSel(c.dataset.id); return; }
        openTalent(data.find(r => r.id === c.dataset.id));
      };
    });
    const mt = $('#moreT'); if (mt) mt.onclick = () => { st.limit += 120; draw(); };
    drawSel();
  };
  TAL.redraw = draw;
  const toggleSel = id => { TAL.sel.has(id) ? TAL.sel.delete(id) : TAL.sel.add(id); $(`.tcard[data-id="${id}"]`).classList.toggle('sel', TAL.sel.has(id)); drawSel(); };
  const drawSel = () => {
    const box = $('#selbar');
    if (!TAL.sel.size) { box.innerHTML = ''; return; }
    const picked = data.filter(r => TAL.sel.has(r.id));
    box.innerHTML = `<div class="selbar"><b>${picked.length} selected</b>
      <button class="btn ghost small" data-b="emails">${icon('copy')}Copy emails</button>
      ${editable ? `<button class="btn ghost small" data-b="mail">${icon('mail')}Email them</button>` : ''}
      ${editable ? `<select class="in" data-b="status" style="width:auto;padding:7px"><option value="">Set status…</option>${statuses.map(s => `<option>${esc(s)}</option>`).join('')}</select>
      <button class="btn ghost small" data-b="contacted">Mark contacted</button>` : ''}
      ${editable && can('shoots', 'edit') ? `<button class="btn blue small" data-b="shoot">${icon('clapper')}Add to a shoot</button>` : ''}
      <span style="flex:1"></span><button class="btn ghost small" data-b="all">Select all shown</button><button class="btn ghost small" data-b="clear">Clear</button></div>`;
    const emails = uniq(picked.map(r => r.email).filter(Boolean));
    $('[data-b=emails]', box).onclick = async () => { (await copyText(emails.join(', '))) ? toast(emails.length + ' emails copied', 'ok') : toast('Copy failed', 'err'); };
    const mb = $('[data-b=mail]', box);
    if (mb) mb.onclick = () => openEmail('talent', { ids: [...TAL.sel] }, () => { TAL.sel.clear(); renderRoute(); });
    $('[data-b=clear]', box).onclick = () => { TAL.sel.clear(); draw(); };
    $('[data-b=all]', box).onclick = () => { data.filter(r => rowMatches(m, r, st)).slice(0, st.limit).forEach(r => TAL.sel.add(r.id)); draw(); };
    const sSel = $('[data-b=status]', box);
    if (sSel) sSel.onchange = async () => {
      if (!sSel.value) return;
      try {
        await api('bulkUpdate', { module: 'talent', ids: [...TAL.sel], data: { status: sSel.value } });
        picked.forEach(r => r.status = sSel.value);
        toast(`${picked.length} set to ${sSel.value}`, 'ok'); TAL.sel.clear(); renderRoute();
      } catch (e) { fail(e); }
    };
    const mc = $('[data-b=contacted]', box);
    if (mc) mc.onclick = async () => {
      const note = await promptBox('Mark as contacted', { label: 'What did you send?', value: 'Emailed', ok: 'Save' });
      if (note == null) return;
      try { await api('markContacted', { module: 'talent', ids: [...TAL.sel], note }); invalidate('talent'); toast('Saved', 'ok'); TAL.sel.clear(); renderRoute(); } catch (e) { fail(e); }
    };
    const sh = $('[data-b=shoot]', box);
    if (sh) sh.onclick = () => addToShootDialog([...TAL.sel]);
  };
  draw();

  $('#q').addEventListener('input', debounce(e => { st.q = e.target.value.trim(); st.limit = 120; draw(); }, 150));
  $$('#stChips .chip').forEach(c => c.onclick = () => { st.f.status = c.dataset.s; $$('#stChips .chip').forEach(x => x.classList.toggle('on', x === c)); draw(); });
  $('#atl').onchange = e => { st.f.in_atlanta = e.target.value; draw(); };
  $('#srt').onchange = e => { const [k, d] = e.target.value.split('|'); st.sort = [k, Number(d)]; draw(); };
  $('#tblV').onclick = () => { TAL.view = 'table'; renderRoute(); };
  const at = $('#addT'); if (at) at.onclick = () => openForm('talent', null, { status: 'New' });
};

function talentCard(r) {
  const first = urlsIn(r.headshots)[0] || r.headshots;
  const ini = initials(r.full_name);
  return `<div class="tcard ${TAL.sel.has(r.id) ? 'sel' : ''}" data-id="${esc(r.id)}">
    <div class="ph">${photoImg(first, 400, ini)}</div>
    <div class="st">${pill(r.status)}</div><div class="ck">${TAL.sel.has(r.id) ? '✓' : ''}</div>
    <div class="info"><b>${esc(r.full_name)}</b><span>${esc([r.in_atlanta === 'Yes' ? 'ATL' : r.in_atlanta ? 'Travels' : '', r.union, r.instagram ? '@' + String(r.instagram).replace(/^@/, '') : ''].filter(Boolean).join(' · '))}</span>
    ${Number(r.rating) ? `<div>${stars(r.rating)}</div>` : ''}</div></div>`;
}

function openTalent(r) {
  openDetail('talent', r);
  const top = stack[stack.length - 1];
  // Refresh the gallery when the drawer closes so status / rating changes show.
  if (top) top.onClose = () => { if (TAL.redraw && S.route.arg === 'talent') TAL.redraw(); };
}

DETAIL_EXTRA.talent = row => {
  const photos = urlsIn(row.headshots);
  return `
    ${photos.length ? `<div class="photos">${photos.map(u => `<a href="${esc(safeUrl(u))}" target="_blank" rel="noopener">${photoImg(u, 800, '')}</a>`).join('')}</div>` : ''}
    ${can('talent', 'edit') ? `<div class="toolbar" style="margin-bottom:16px"><select class="in" id="tStat" style="width:auto">${fieldOf('talent', 'status').o.map(s => `<option ${s === row.status ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select><span id="tRate">${stars(row.rating, false)}</span></div>` : ''}
    <div class="chips" style="margin-bottom:16px">
      ${row.email ? `<a class="btn ghost small" href="mailto:${esc(row.email)}">${icon('mail')}Email</a>` : ''}
      ${row.phone ? `<a class="btn ghost small" href="sms:${esc(String(row.phone).replace(/[^\d+]/g, ''))}">Text</a>` : ''}
      ${row.instagram ? `<a class="btn ghost small" target="_blank" rel="noopener" href="https://instagram.com/${esc(String(row.instagram).replace(/^@/, '').replace(/^https?:\/\/(www\.)?instagram\.com\//, ''))}">Instagram ↗</a>` : ''}
    </div>`;
};

DETAIL_WIRE.talent = (r, el) => {
  const quick = async data => {
    try { const out = await api('update', { module: 'talent', id: r.id, data }); Object.assign(r, out.row); patchCache('talent', out.row); toast('Saved', 'ok'); }
    catch (e) { fail(e); }
  };
  const sSel = $('#tStat', el);
  if (sSel) sSel.onchange = () => quick({ status: sSel.value });
  $$('#tRate button', el).forEach(b => b.onclick = () => {
    const v = String(r.rating) === b.dataset.v ? '' : b.dataset.v;
    $$('#tRate button', el).forEach(x => x.classList.toggle('on', !!v && Number(x.dataset.v) <= Number(v)));
    quick({ rating: v });
  });
};

DETAIL_ACTIONS.talent = (row, foot) => {
  if (can('talent', 'edit') && can('shoots', 'edit')) {
    const b = document.createElement('button');
    b.className = 'btn blue small'; b.innerHTML = icon('clapper') + 'Add to a shoot';
    b.onclick = () => addToShootDialog([row.id]);
    foot.appendChild(b);
  }
};

async function addToShootDialog(ids) {
  let shoots;
  try { shoots = (await rows('shoots', true)).filter(s => s.date >= addDays(todayIso(), -1) && s.status !== 'Cancelled').sort((a, b) => cmp(a.date, b.date)); }
  catch (e) { return fail(e); }
  const roles = (fieldOf('attendance', 'role') || {}).o || ['Needs Role'];
  const el = modal({ title: `Add ${ids.length} to a shoot`, cls: 'small',
    body: shoots.length ? `<div class="field"><label class="lbl">Shoot day</label><select class="in" id="shSel">${shoots.map(s => `<option value="${s.id}">${esc(fmtDate(s.date, { dow: true }))} — ${esc([s.production, s.title].filter(Boolean).join(' · ') || 'Shoot')}</option>`).join('')}</select></div>
      <div class="field"><label class="lbl">Role</label><select class="in" id="shRole">${roles.map(r => `<option ${r === 'Needs Role' ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select><div class="hint">They're added to the shoot's cast list, marked <b>Booked</b>, and added to People &amp; Rates.</div></div>`
      : `<div class="empty">No upcoming shoots. Create a Shoot Day first.</div>`,
    footer: `<button class="btn ghost" data-a="no">Cancel</button>${shoots.length ? '<button class="btn" data-a="yes">Add to shoot</button>' : '<a class="btn" href="#/m/shoots">Go to Shoot Days</a>'}` });
  el.querySelector('[data-a=no]').onclick = closeTop;
  const y = el.querySelector('[data-a=yes]');
  if (y) y.onclick = async () => {
    y.disabled = true;
    try {
      const shootId = $('#shSel', el).value;
      const out = await api('talentToShoot', { shootId, ids, role: $('#shRole', el).value });
      invalidate('talent', 'shoots', 'people');
      refreshLookups();
      TAL.sel.clear();
      closeAll(); toast(`${out.result.added} added to the ${fmtDate(out.result.shootDate)} shoot`, 'ok');
      if (await confirmBox(`Send ${ids.length === 1 ? 'a booking email' : ids.length + ' booking emails'} from casting now? You'll see a preview first.`, { ok: 'Preview emails', title: 'Let them know?' })) openEmail('booking', { shootId, ids });
      else renderRoute();
    } catch (e) { fail(e); y.disabled = false; }
  };
}

/* ---------- calendar.js ---------- */
/* =====================================================================
   Shared calendar — events + shoots + releases + deadlines + tasks
   ===================================================================== */

const CAL = { month: null, mode: null, hide: {} };
const CAL_TYPES = [['Shoot', 'var(--red)'], ['Release', 'var(--green)'], ['Deadline', 'var(--amber)'], ['Meeting', 'var(--blue)'], ['Task', 'var(--purple)'], ['Event', 'var(--dim)']];

VIEWS.calendar = async function (_, main) {
  const today = todayIso();
  if (!CAL.month) CAL.month = today.slice(0, 7);
  if (!CAL.mode) CAL.mode = window.innerWidth < 820 ? 'agenda' : 'month';
  const [y, mo] = CAL.month.split('-').map(Number);
  const first = `${y}-${pad2(mo)}-01`;
  const gridStart = addDays(first, -isoToDate(first).getUTCDay());
  const gridEnd = addDays(gridStart, 41);
  const from = CAL.mode === 'agenda' ? (CAL.month === today.slice(0, 7) ? today : first) : gridStart;
  const to = CAL.mode === 'agenda' ? addDays(from, 45) : gridEnd;
  const items = (await api('calendar', { from, to })).items;
  const vis = items.filter(i => !CAL.hide[i.type]);
  const monthName = new Date(Date.UTC(y, mo - 1, 15)).toLocaleString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });

  main.innerHTML = header('Calendar', 'Shoots, releases, deadlines, meetings and tasks in one place.',
    `<button class="btn ghost small hidden" id="gcalBtn">${icon('calendar')}Add to my Google Calendar</button><button class="btn ghost small" id="icsBtn" title="One-time download for other calendar apps">${icon('download')}.ics</button>${canCreate('calendar') ? `<button class="btn" id="addE">${icon('plus')}Add event</button>` : ''}`) +
    `<div class="toolbar">
      <button class="btn ghost small" id="pm">${icon('chevL')}</button>
      <b style="min-width:150px;text-align:center">${esc(monthName)}</b>
      <button class="btn ghost small" id="nm">${icon('chevR')}</button>
      <button class="btn ghost small" id="tm">Today</button>
      <div class="chips" style="margin-left:8px"><button class="chip ${CAL.mode === 'month' ? 'on' : ''}" data-mode="month">Month</button><button class="chip ${CAL.mode === 'agenda' ? 'on' : ''}" data-mode="agenda">List</button></div>
      <div style="flex:1"></div>
      <div class="legend">${CAL_TYPES.map(([t, c]) => `<span style="cursor:pointer;${CAL.hide[t] ? 'opacity:.35' : ''}" data-type="${t}"><i style="background:${c}"></i>${t}</span>`).join('')}</div>
    </div><div id="calBody"></div>`;

  const body = $('#calBody');
  if (CAL.mode === 'month') {
    let html = `<div class="cal"><div class="cal-head">${DOW.map(d => `<div>${d}</div>`).join('')}</div><div class="cal-grid">`;
    for (let i = 0; i < 42; i++) {
      const d = addDays(gridStart, i);
      const its = vis.filter(x => x.date === d || (x.endDate && x.date <= d && x.endDate >= d));
      html += `<div class="cal-day ${d.slice(0, 7) !== CAL.month ? 'out' : ''} ${d === today ? 'today' : ''}" data-d="${d}">
        <div class="d">${isoToDate(d).getUTCDate()}</div>
        ${its.slice(0, 4).map(x => `<div class="ev ${esc(x.type)}" title="${esc(x.title)}">${x.time ? esc(fmtTime(x.time)) + ' ' : ''}${esc(x.title)}</div>`).join('')}
        ${its.length > 4 ? `<div class="ev more">+${its.length - 4} more</div>` : ''}
        <div class="dots">${its.slice(0, 6).map(x => `<i class="${esc(x.type)}"></i>`).join('')}</div></div>`;
    }
    body.innerHTML = html + '</div></div>';
    $$('.cal-day', body).forEach(c => c.onclick = () => dayDialog(c.dataset.d, vis));
  } else {
    const byDay = {};
    vis.forEach(x => { (byDay[x.date] = byDay[x.date] || []).push(x); });
    const days = Object.keys(byDay).sort();
    body.innerHTML = days.length ? days.map(d => `<div class="card" style="margin-bottom:12px"><h3>${esc(relDay(d))}${relDay(d) !== fmtDate(d) ? ` <span class="muted small" style="font-weight:500">${esc(fmtDate(d, { dow: true }))}</span>` : ''}</h3>
      <div class="list">${byDay[d].map(x => calLine(x)).join('')}</div></div>`).join('')
      : '<div class="empty"><b>Nothing coming up</b>The next 6 weeks are clear.</div>';
  }
  $$('[data-item]', body).forEach(el => { const it = vis.find(v => v.src + v.id + v.date === el.dataset.key); el.onclick = () => openItem(it); });

  const shift = n => { const d = new Date(Date.UTC(y, mo - 1 + n, 1)); CAL.month = d.toISOString().slice(0, 7); renderRoute(); };
  $('#pm').onclick = () => shift(-1);
  $('#nm').onclick = () => shift(1);
  $('#tm').onclick = () => { CAL.month = today.slice(0, 7); renderRoute(); };
  $$('[data-mode]').forEach(b => b.onclick = () => { CAL.mode = b.dataset.mode; renderRoute(); });
  $$('.legend [data-type]').forEach(s => s.onclick = () => { CAL.hide[s.dataset.type] = !CAL.hide[s.dataset.type]; renderRoute(); });
  const ae = $('#addE'); if (ae) ae.onclick = () => openForm('calendar', null, { date: CAL.month === today.slice(0, 7) ? today : first, type: 'Meeting' });
  $('#icsBtn').onclick = () => download('funarios-calendar.ics', buildIcs(vis), 'text/calendar');
  if (S.boot.settings.calendar_sync === 'on') api('calendarStatus', {}, { quiet: true }).then(r => {
    const b = $('#gcalBtn');
    if (!b || !r.status.addLink) return;
    b.classList.remove('hidden');
    b.title = 'Live-synced Google Calendar: ' + r.status.name;
    b.onclick = () => window.open(r.status.addLink, '_blank', 'noopener');
  }).catch(() => {});
};

function calLine(x) {
  return `<div class="li" style="cursor:pointer" data-item data-key="${esc(x.src + x.id + x.date)}"><span class="dot ${({ Shoot: 'red', Release: 'green', Deadline: 'amber', Meeting: 'blue', Task: 'purple' })[x.type] || ''}"></span>
    <div class="body"><div class="t">${esc(x.title)}</div><div class="m">${pill(x.type)} ${x.time ? esc(fmtTime(x.time)) + (x.endTime ? '–' + esc(fmtTime(x.endTime)) : '') : 'All day'}${x.location ? ' · ' + esc(x.location) : ''}</div></div></div>`;
}

function dayDialog(d, vis) {
  const its = vis.filter(x => x.date === d || (x.endDate && x.date <= d && x.endDate >= d));
  const el = modal({ title: esc(fmtDate(d, { dow: true, year: true })), cls: 'small',
    body: its.length ? `<div class="list">${its.map(calLine).join('')}</div>` : '<div class="empty" style="padding:18px">Nothing on this day.</div>',
    footer: canCreate('calendar') ? `<button class="btn" data-a="add">${icon('plus')}Add event this day</button>` : `<button class="btn ghost" data-a="close">Close</button>` });
  $$('[data-item]', el).forEach(li => { const it = its.find(v => v.src + v.id + v.date === li.dataset.key); li.onclick = () => { closeTop(); openItem(it); }; });
  const a = el.querySelector('[data-a=add]'); if (a) a.onclick = () => { closeTop(); openForm('calendar', null, { date: d, type: 'Meeting' }); };
  const c = el.querySelector('[data-a=close]'); if (c) c.onclick = closeTop;
}

async function openItem(it) {
  if (!it) return;
  if (['calendar', 'shoots', 'releases', 'tasks'].includes(it.src)) {
    try { const list = await rows(it.src); const r = list.find(x => x.id === it.id); if (r) return openDetail(it.src, r); } catch (e) { return fail(e); }
  }
  if (it.src === 'payroll') return go('#/payroll');
  modal({ title: esc(it.title), cls: 'small', body: `<p>${esc(fmtDate(it.date, { dow: true }))}${it.time ? ' at ' + esc(fmtTime(it.time)) : ''}</p>${it.src === 'weekly' ? '<p class="muted">Every week: send everyone next week\'s schedule. Change or turn this off in Settings (weekly_preview).</p>' : ''}` });
}

function buildIcs(items) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const escI = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//FUNarios Hub//EN', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:FUNarios'];
  items.forEach(it => {
    const d = it.date.replace(/-/g, '');
    lines.push('BEGIN:VEVENT', `UID:${it.src}-${it.id}-${d}@funarios-hub`, `DTSTAMP:${stamp}`);
    if (it.time) {
      const t = it.time.replace(':', '') + '00';
      lines.push(`DTSTART;TZID=America/New_York:${d}T${t}`);
      if (it.endTime) lines.push(`DTEND;TZID=America/New_York:${(it.endDate || it.date).replace(/-/g, '')}T${it.endTime.replace(':', '')}00`);
    } else {
      lines.push(`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${addDays(it.endDate || it.date, 1).replace(/-/g, '')}`);
    }
    lines.push(`SUMMARY:${escI(it.title)}`);
    if (it.location) lines.push(`LOCATION:${escI(it.location)}`);
    if (it.notes) lines.push(`DESCRIPTION:${escI(it.notes)}`);
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

const TASKS = { who: 'all', table: false };

  if (TASKS.table) return VIEWS.generic('tasks', main);
  const data = await rows('tasks');
  const statuses = fieldOf('tasks', 'status').o;
  const me = S.boot.user.username;
  const own = access('tasks') === 'own';
  const today = todayIso();
  const users = S.boot.lookups.users || [];
  const list = data.filter(t => TASKS.who === 'all' || own ? true : TASKS.who === 'mine' ? t.assignee === me : t.assignee === TASKS.who);
  main.innerHTML = header('Tasks', own ? 'Tasks assigned to you.' : 'Who\'s doing what. Tap a task to open it, or use Start / Done to move it along.',

MODCFG.releases.top = (box, data) => {
  const today = todayIso();
  const alerts = [];
  data.forEach(r => {
    const done = ['released', 'scheduled', 'final locked'].includes(String(r.status).toLowerCase()) || r.final_received === 'TRUE';
    if (done || r.date < today) return;
    if (r.final_due) {
      const d = daysBetween(today, r.final_due);
      if (d < 0) alerts.push(['red', `${r.show} — final overdue by ${-d} day${d === -1 ? '' : 's'}`, `${r.editor || 'Unassigned'} · drops ${fmtDate(r.date)}`]);
      else if (d <= 3) alerts.push(['amber', `${r.show} — final due ${d === 0 ? 'today' : 'in ' + d + ' day' + (d === 1 ? '' : 's')}`, `${r.editor || 'Unassigned'} · drops ${fmtDate(r.date)}`]);
    }
    if (!r.editor && daysBetween(today, r.date) <= 21 && (r.final_due || r.rough_cut_due)) alerts.push(['amber', `${r.show} — no editor assigned`, `Drops ${fmtDate(r.date)}`]);
  });
  const next7 = data.filter(r => r.date >= today && daysBetween(today, r.date) <= 7).length;
  box.innerHTML = `<div class="grid g3 keep2" style="margin-bottom:14px">
      <div class="stat blue"><div class="n">${next7}</div><div class="l">Dropping in 7 days</div></div>
      <div class="stat ${alerts.length ? 'red' : 'green'}"><div class="n">${alerts.length}</div><div class="l">At risk / overdue</div></div>
      <div class="stat"><div class="n">${data.filter(r => r.date >= today).length}</div><div class="l">Upcoming total</div></div></div>
    ${alerts.length ? `<div class="card" style="margin-bottom:14px"><div class="list">${alerts.map(a => `<div class="li"><span class="dot ${a[0]}"></span><div class="body"><div class="t">${esc(a[1])}</div><div class="m">${esc(a[2])}</div></div></div>`).join('')}</div></div>` : ''}`;

  if (!st.initDone) { st.initDone = true; st.f = {}; }
};

/* =====================================================================
   Email composer — preview, edit and send from casting@ (never auto-sends)
   kinds: cast (shoot details to the call sheet), booking (personal, per
   actor), interview (personal, per applicant), talent (message to actors)
   ===================================================================== */

const EMAIL_TITLES = { cast: 'Email the cast & crew', booking: 'Send booking emails', interview: 'Send interview invite', talent: 'Email selected actors' };

async function openEmail(kind, params = {}, after) {
  let p;
  try { p = (await api('emailPreview', { kind, ...params })).preview; } catch (e) { return fail(e); }
  const body = document.createElement('div');
  const rec = p.recipients.map((r, i) => ({ ...r, i, on: !!r.email }));
  const personalHint = p.personalized ? `<div class="hint">Each person gets their own copy. <code>{first_name}</code>, <code>{name}</code> and <code>{role}</code> are filled in for each person.</div>` : '';
  body.innerHTML = `
    ${p.fromOk ? '' : `<div class="banner red"><div>${esc(p.fromWarning)}</div></div>`}
    <div class="kv" style="margin-bottom:14px;grid-template-columns:70px 1fr">
      <dt>From</dt><dd><b>${esc(p.fromName)}</b> &lt;${esc(p.from)}&gt;</dd>
      <dt>To</dt><dd>${p.personalized ? 'Each person individually' : `${esc(p.to)} <span class="muted">· everyone below on BCC</span>`}</dd>
    </div>
    <div class="section-title" style="margin-top:0">Recipients <span id="rCount"></span></div>
    <div class="table-wrap" style="max-height:230px;margin-bottom:14px"><table class="tbl" id="rTbl"><tbody>${rec.map(r => `
      <tr style="cursor:default" data-i="${r.i}"><td style="width:28px"><input type="checkbox" data-on ${r.on ? 'checked' : ''}></td>
      <td><b>${esc(r.name || '—')}</b>${r.role ? `<div class="tiny muted">${esc(r.role)}</div>` : ''}</td>
      <td><input class="in" data-email value="${esc(r.email || '')}" placeholder="No email on file — type one" style="padding:6px 8px;${r.email ? '' : 'border-color:rgba(242,169,59,.6)'}"></td></tr>`).join('') || '<tr><td class="muted">No one to email yet.</td></tr>'}</tbody></table></div>
    <div class="field"><label class="lbl">Subject</label><input class="in" id="eSubj" value="${esc(p.subject)}"></div>
    <div class="field"><label class="lbl">Message</label><textarea class="in" id="eBody" style="min-height:230px">${esc(p.body)}</textarea>${personalHint}</div>
    ${p.attachments.length ? `<div class="section-title">Attachments</div><div class="ms">${p.attachments.map(a => `<label title="${esc(a.ok ? a.name : a.reason)}" style="${a.ok ? '' : 'opacity:.55'}"><input type="checkbox" data-att="${esc(a.key)}" ${a.ok && !a.optional ? 'checked' : ''} ${a.ok ? '' : 'disabled'}>📎 ${esc(a.label)}${a.ok ? '' : ` <span class="tiny" style="color:var(--amber)">(${esc(a.reason)})</span>`}</label>`).join('')}</div>` : ''}
    ${kind === 'cast' || kind === 'booking' ? `<label class="tiny" style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="eInvite" checked>📅 Also send each person a Google Calendar invite for this shoot</label>` : ''}
    <div class="err" id="eErr" style="margin-top:10px"></div>`;
  const el = modal({ title: esc(EMAIL_TITLES[kind] || 'Send email'), body, footer: `<button class="btn ghost" data-a="no">Cancel</button><button class="btn" data-a="send" ${p.fromOk ? '' : 'disabled'}>${icon('mail')}Send</button>` });
  const count = () => {
    const n = $$('#rTbl tr[data-i]', el).filter(tr => $('[data-on]', tr).checked && $('[data-email]', tr).value.includes('@')).length;
    $('#rCount', el).textContent = `· ${n} will get it`;
    const btn = el.querySelector('[data-a=send]');
    btn.innerHTML = icon('mail') + (n ? `Send to ${n}` : 'Send');
    return n;
  };
  $$('#rTbl tr[data-i]', el).forEach(tr => {
    const cb = $('[data-on]', tr), inp = $('[data-email]', tr);
    cb.onchange = count;
    inp.oninput = () => { if (inp.value.includes('@')) cb.checked = true; inp.style.borderColor = ''; count(); };
  });
  count();
  el.querySelector('[data-a=no]').onclick = closeTop;
  el.querySelector('[data-a=send]').onclick = async () => {
    const recipients = $$('#rTbl tr[data-i]', el).filter(tr => $('[data-on]', tr).checked).map(tr => {
      const r = rec[Number(tr.dataset.i)];
      return { name: r.name, role: r.role, email: $('[data-email]', tr).value.trim() };
    }).filter(r => r.email);
    if (!recipients.length) { $('#eErr', el).textContent = 'Pick at least one person with an email address.'; return; }
    const attach = {};
    $$('[data-att]', el).forEach(c => { attach[c.dataset.att] = c.checked; });
    const n = recipients.length;
    if (!(await confirmBox(`Send this email to <b>${n}</b> ${n === 1 ? 'person' : 'people'} from <b>${esc(p.from)}</b>?`, { ok: 'Send now', title: 'Send email' }))) return;
    const btn = el.querySelector('[data-a=send]');
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const out = (await api('emailSend', { kind, ...params, subject: $('#eSubj', el).value, body: $('#eBody', el).value, recipients, attach, invite: $('#eInvite', el) ? $('#eInvite', el).checked : false })).result;
      closeAll();
      toast(`Sent to ${out.sent} ${out.sent === 1 ? 'person' : 'people'} from ${out.from}`, 'ok');
      if (out.failed.length) toast('Some failed: ' + out.failed.join('; '), 'err');
      if (out.invite) { if (out.invite.error) toast('Calendar invites failed: ' + out.invite.error, 'err'); else if (out.invite.invited) toast(`📅 Calendar invite sent to ${out.invite.invited}`, 'ok'); else if (out.invite.note) toast('No calendar invites: ' + out.invite.note); }
      if (out.skippedAttachments.length) toast('Not attached: ' + out.skippedAttachments.join(', '), 'err');
      invalidate('talent', 'applicants', 'people', 'emails');
      if (after) after(out); else renderRoute();
    } catch (e) { $('#eErr', el).textContent = e.message; btn.disabled = false; count(); }
  };
}

  $('#uq').oninput = e => { const q = e.target.value.toLowerCase(); $$('#uRows tr').forEach(tr => tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none'); };
  const upd = async (username, changes, msg = 'Saved') => {
    try { const r = await api('adminUpdateUser', { username, changes }); if (!r.ok) throw new Error(r.error); toast(msg, 'ok'); } catch (e) { fail(e); }
    adminUsers(body);
  };
  $$('#uRows tr').forEach(tr => {
    const un = tr.dataset.u, u = out.users.find(x => x.username === un);
    $('[data-role]', tr).onchange = e => upd(un, { role: e.target.value }, 'Role updated');
    $('[data-pw]', tr).onclick = async () => {
      const pw = await promptBox('Reset password for @' + un, { label: 'New password (min 6 characters)', value: suggestPassword(), ok: 'Set password', hint: 'Copy it and send it to them — they\'ll use it to sign in.' });
      if (pw) upd(un, { password: pw }, 'Password updated');
    };
    $('[data-toggle]', tr).onclick = async () => {
      if (u.active && !(await confirmBox(`Turn off <b>@${esc(un)}</b>? They'll be signed out everywhere and can't sign in until you turn them back on.`, { ok: 'Turn off', danger: true }))) return;
      upd(un, { active: !u.active });
    };
    $('[data-edit]', tr).onclick = () => userDialog(body, roles, people, u);
  });
  $('#addU').onclick = () => userDialog(body, roles, people, null);
}

function suggestPassword() {
  const words = ['Studio', 'Scene', 'Action', 'Camera', 'Script', 'Rolling', 'Cut', 'Take', 'Reel', 'Lights'];
  return words[Math.floor(Math.random() * words.length)] + '-' + (1000 + Math.floor(Math.random() * 9000));
}

function userDialog(body, roles, people, u) {
  const editing = !!u;
  const el = modal({ title: editing ? 'Edit @' + esc(u.username) : 'Add a user',
    body: `<datalist id="dl-pp">${people.map(p => `<option value="${esc(p)}">`).join('')}</datalist>
      <div class="form-grid">
        <div class="field"><label class="lbl req">Full name</label><input class="in" id="uF" value="${esc(u ? u.fullName : '')}"></div>
        ${editing ? '' : `<div class="field"><label class="lbl req">Username</label><input class="in" id="uU" autocapitalize="off" placeholder="e.g. lonnie"></div>`}
        ${editing ? '' : `<div class="field"><label class="lbl req">Password</label><input class="in" id="uP" value="${esc(suggestPassword())}"><div class="hint">Min 6 characters. You'll send this to them.</div></div>`}
        <div class="field"><label class="lbl req">Role</label><select class="in" id="uR">${roles.map(r => `<option ${u && r === u.role ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></div>
        <div class="field"><label class="lbl">Linked person (People &amp; Rates name)</label><input class="in" id="uPe" list="dl-pp" value="${esc(u ? u.person : '')}" placeholder="Needed for crew / editors"></div>
        <div class="field"><label class="lbl">Email</label><input class="in" id="uE" type="email" value="${esc(u ? u.email : '')}"></div>
      </div><div class="err" id="uErr"></div>`,
    footer: `<button class="btn ghost" data-a="no">Cancel</button><button class="btn" data-a="yes">${editing ? 'Save' : 'Create user'}</button>` });
  if (!editing) $('#uF', el).addEventListener('input', e => { const un = $('#uU', el); if (!un.dataset.touched) un.value = e.target.value.trim().split(/\s+/)[0].toLowerCase().replace(/[^a-z0-9._-]/g, ''); });
  if (!editing) $('#uU', el).addEventListener('input', e => e.target.dataset.touched = '1');
  el.querySelector('[data-a=no]').onclick = closeTop;
  el.querySelector('[data-a=yes]').onclick = async () => {
    const err = $('#uErr', el);
    try {
      let r;
      if (editing) r = await api('adminUpdateUser', { username: u.username, changes: { fullName: $('#uF', el).value, role: $('#uR', el).value, person: $('#uPe', el).value, email: $('#uE', el).value } });
      else r = await api('adminAddUser', { user: { fullName: $('#uF', el).value, username: $('#uU', el).value.trim(), password: $('#uP', el).value, role: $('#uR', el).value, person: $('#uPe', el).value, email: $('#uE', el).value } });
      if (!r.ok) throw new Error(r.error);
      closeAll();
      if (!editing) {
        const msg = `Hi ${$('#uF', el).value.split(' ')[0] || ''}! Here's your login for the ${S.boot.settings.app_name || 'FUNarios Hub'}:\n\n${location.origin + location.pathname}\nUsername: ${$('#uU', el).value.trim()}\nPassword: ${$('#uP', el).value}\n\nTip: on your phone, open the link and choose "Add to Home Screen" so it works like an app.`;
        const m2 = modal({ title: 'User created ✓', cls: 'small', body: `<p class="small muted" style="margin-top:0">Send them this message:</p><textarea class="in" style="min-height:170px" readonly>${esc(msg)}</textarea>`,
          footer: `<button class="btn" data-a="copy">${icon('copy')}Copy message</button>` });
        m2.querySelector('[data-a=copy]').onclick = async () => { await copyText(msg); toast('Copied', 'ok'); closeAll(); };
      } else toast('Saved', 'ok');
      adminUsers(body);
    } catch (e) { err.textContent = e.message; }
  };
}

// ---------- Permissions ----------
async function adminPerms(body) {
  const out = await api('adminGetPermissions');
  const roles = out.roles.filter(r => r.role.toLowerCase() !== 'admin');
  const groups = uniq(out.modules.map(m => m.group));
  body.innerHTML = `<div class="banner blue"><div><b>How access works:</b> <span class="pill">none</span> hidden · <span class="pill amber">own</span> only their own records (their days, pay, videos, tasks) · <span class="pill blue">view</span> see everything · <span class="pill green">edit</span> add &amp; change · <span class="pill red">full</span> also delete (and mark payroll paid). Admins always have full access. Changes apply right away.</div></div>
    <div class="table-wrap perm"><table class="tbl"><thead><tr><th>Section</th>${roles.map(r => `<th title="${esc(r.description)}">${esc(r.role)}</th>`).join('')}</tr></thead><tbody>
    ${groups.map(g => `<tr style="cursor:default"><td colspan="${roles.length + 1}" class="tiny dim" style="text-transform:uppercase;letter-spacing:1px;background:var(--bg2)">${esc(g)}</td></tr>` +
      out.modules.filter(m => m.group === g).map(m => `<tr style="cursor:default"><td>${esc(m.label)}${m.hidden ? ' <span class="tiny dim">(inside Payroll)</span>' : ''}</td>${roles.map(r => {
        const a = (out.matrix[r.role.toLowerCase()] || {})[m.key] || 'none';
        const opts = LEVELS.filter(l => l !== 'own' || m.own || m.key === 'payroll');
        return `<td><select class="a-${a}" data-role="${esc(r.role)}" data-mod="${m.key}">${opts.map(l => `<option ${l === a ? 'selected' : ''}>${l}</option>`).join('')}</select></td>`;
      }).join('')}</tr>`).join('')).join('')}</tbody></table></div>
    <div class="toolbar" style="margin-top:14px"><button class="btn ghost small" id="addRole">${icon('plus')}Add a role</button><span class="tiny muted">e.g. Writer, Social Media, Intern — then set what they can see.</span></div>`;
  $$('select[data-mod]', body).forEach(s => s.onchange = async () => {
    s.className = 'a-' + s.value;
    try { const r = await api('adminSetPermission', { role: s.dataset.role, module: s.dataset.mod, access: s.value }); if (!r.ok) throw new Error(r.error); toast(`${s.dataset.role}: ${s.dataset.mod} → ${s.value}`, 'ok'); } catch (e) { fail(e); }
  });
  $('#addRole').onclick = async () => {
    const name = await promptBox('Add a role', { label: 'Role name', ok: 'Add role' });
    if (!name) return;
    try { const r = await api('adminAddRole', { role: name.trim() }); if (!r.ok) throw new Error(r.error); toast('Role added — everything starts hidden', 'ok'); adminPerms(body); } catch (e) { fail(e); }
  };
}

// ---------- Import & Sync ----------
async function adminImport(body) {
  const items = [
    ['talent', 'Actor submissions', 'Copies every actor from the "Auditions" tab of the Funarios Producer Applications sheet. Safe to run again — only new people are added.'],
    ['applicants', 'Producer applicants', 'Copies the "Applications" tab of the same sheet.'],
    ['releases', 'Release calendar', 'Pulls Darius\'s "Master Calendar". Re-running updates changed rows (his sheet stays the source of truth).'],
    ['payroll', 'Old payroll dashboard', 'One-time copy of People &amp; Rates, Schedule + Attendance, Editor Deliverables and pending Editor Submissions from the old dashboard\'s published sheet links.']
  ];
  body.innerHTML = `<div class="banner green"><div><b>Turn on auto-sync</b> once and new actor/producer submissions and release changes come in every hour by themselves.</div><button class="btn small green" id="autoSync" style="margin-left:auto">Turn on hourly sync</button></div>
    <div class="grid g2">${items.map(([k, t, d]) => `<div class="card"><h3>${esc(t)}</h3><p class="small muted" style="margin-top:0">${d}</p><button class="btn small" data-imp="${k}">${icon('download')}Import now</button><div class="small" style="margin-top:10px" id="res-${k}"></div></div>`).join('')}</div>
    <div class="card" style="margin-top:14px" id="calCard"><h3>${icon('calendar')} Google Calendar (live sync)</h3><div class="small muted">Loading…</div></div>
    <div class="tiny muted" style="margin-top:12px">Imports read the sheets as <b>your</b> Google account (the one that owns the hub's Apps Script), so it needs at least view access to them. Sheet IDs and links live under Settings.</div>`;
  $$('[data-imp]', body).forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = 'Importing…';
    const res = $('#res-' + b.dataset.imp);
    try {
      const out = await api('adminImport', { source: b.dataset.imp });
      res.innerHTML = '<span class="paid-yes">Done:</span> ' + esc(Object.entries(out.result).map(([k, v]) => k + ' ' + (typeof v === 'object' ? JSON.stringify(v) : v)).join(' · '));
      S.cache = {}; refreshLookups();
    } catch (e) { res.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    b.disabled = false; b.innerHTML = icon('download') + 'Import now';
  });
  $('#autoSync').onclick = async () => { try { const r = await api('adminInstallSync'); toast(r.result, 'ok'); } catch (e) { fail(e); } };
  drawCalCard();
}

// ---------- Settings ----------
async function adminSettings(body) {
  const out = await api('adminGetSettings');
  body.innerHTML = `<div class="card">${out.settings.map(s => `<div class="setting-row"><div><b class="small">${esc(s.key)}</b><div class="tiny muted">${esc(s.description)}</div></div>
    ${/^tpl_.*_body$/.test(s.key) || s.value.includes('\n') ? `<textarea class="in" data-k="${esc(s.key)}" style="min-height:180px">${esc(s.value)}</textarea>` : `<input class="in" data-k="${esc(s.key)}" value="${esc(s.value)}">`}<button class="btn ghost small" data-save="${esc(s.key)}">Save</button></div>`).join('')}</div>`;
  $$('[data-save]', body).forEach(b => b.onclick = async () => {
    const v = $(`[data-k="${b.dataset.save}"]`, body).value;
    try { const r = await api('adminSetSetting', { key: b.dataset.save, value: v }); if (!r.ok) throw new Error(r.error); toast('Saved', 'ok'); if (b.dataset.save in S.boot.settings) S.boot.settings[b.dataset.save] = v; } catch (e) { fail(e); }
  });
}

// ---------- Sessions ----------
async function adminSessions(body) {
  const out = await api('adminSessions');
  body.innerHTML = out.sessions.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>User</th><th>Devices signed in</th><th>Last sign-in</th><th></th></tr></thead><tbody>
    ${out.sessions.sort((a, b) => b.last - a.last).map(s => `<tr style="cursor:default"><td>@${esc(s.username)}</td><td>${s.devices}</td><td class="muted">${s.last ? esc(new Date(s.last).toLocaleString()) : '—'}</td>
      <td style="text-align:right">${s.username.toLowerCase() === S.boot.user.username.toLowerCase() ? '' : `<button class="btn ghost tiny" data-out="${esc(s.username)}">Sign out everywhere</button>`}</td></tr>`).join('')}</tbody></table></div>
    <div class="tiny muted" style="margin-top:10px">Logins last ${esc(S.boot.settings.session_days || '14')} days (change <b>session_days</b> in Settings). Turning a user off also signs them out.</div>`
    : '<div class="empty">No one is signed in.</div>';
  $$('[data-out]', body).forEach(b => b.onclick = async () => {
    try { const r = await api('adminSignOutUser', { username: b.dataset.out }); toast(`Signed out ${r.count} device(s)`, 'ok'); adminSessions(body); } catch (e) { fail(e); }
  });
}

async function drawCalCard() {
  const box = $('#calCard');
  if (!box) return;
  let st;
  try { st = (await api('calendarStatus')).status; } catch (e) { if (box.isConnected) box.innerHTML = `<h3>Google Calendar</h3><div class="err">${esc(e.message)}</div>`; return; }
  box.innerHTML = `<h3>${icon('calendar')} Google Calendar (live sync) ${st.on ? '<span class="pill green">On</span>' : '<span class="pill">Off</span>'}</h3>
    <p class="small muted" style="margin-top:0">Shoots, releases, edit deadlines, hub events and payroll-due days go onto the <b>${esc(st.name)}</b> Google Calendar of the account running the hub, and update right after every change. Events limited to certain roles stay inside the hub.</p>
    <div class="small" style="margin-bottom:10px">${st.calendarId ? `Calendar ID: <code style="word-break:break-all">${esc(st.calendarId)}</code>` : 'Not created yet — click Sync now.'}<br>
      Last sync: ${st.lastSync ? esc(fmtStamp(st.lastSync)) : 'never'}${st.lastError ? `<br><span class="err">Last error: ${esc(st.lastError)}</span>` : ''}</div>
    <div class="chips"><button class="btn small" id="calSync">${icon('refresh')}Sync now</button>${st.addLink ? `<a class="btn ghost small" href="${esc(st.addLink)}" target="_blank" rel="noopener">Open in Google Calendar ↗</a>` : ''}</div>
    <div class="tiny muted" style="margin-top:10px">To let the team see it: open Google Calendar as the hub account → ${esc(st.name)} → Settings and sharing → <b>Share with specific people</b> (add their emails, "See all event details"). They can also use "Add to my Google Calendar" on the hub's Calendar page.</div>`;
  if (!box.isConnected) return;
  $('#calSync', box).onclick = async () => {
    const b = $('#calSync', box); b.disabled = true; b.textContent = 'Syncing…';
    try { const r = await api('calendarSyncNow'); const x = r.result; toast(typeof x === 'string' ? x : `Calendar synced: ${x.created} added, ${x.updated} updated, ${x.removed} removed`, 'ok'); }
    catch (e) { fail(e); }
    drawCalCard();
  };
}


// ---------- Database (Google Sheet → Supabase) ----------
async function adminDatabase(body) {
  const st = (await api('adminDbStatus')).status;
  const step = (n, title, html) => `<div class="card" style="margin-bottom:12px"><h3><span class="pill ${n.done ? 'green' : ''}">${n.done ? '✓' : n.i}</span> ${title}</h3>${html}</div>`;
  const onSb = st.mode === 'supabase';
  body.innerHTML = `<div class="card" style="margin-bottom:12px"><h3>${icon('layers')} Where the hub keeps its data</h3>
      <div style="display:grid;gap:8px"><div><span class="muted">Running on</span> <b>${onSb ? 'Supabase (live)' : 'Google Sheet'}</b></div>
      <div><span class="muted">Supabase</span> ${st.configured ? `<b>connected</b> <span class="tiny muted">${esc(st.url)}</span>` : '<span class="pill amber">not set up</span>'}</div>
      ${onSb ? `<div><span class="muted">Last backup copy to the Sheet</span> ${st.lastSheetCopy ? esc(fmtStamp(st.lastSheetCopy)) : 'not yet'} <span class="tiny muted">(every night at 3am)</span></div>` : ''}</div></div>` +
    (onSb ? `<div class="card"><h3>Backup copy</h3><p class="small muted">Everything is copied into the Google Sheet every night. Copy now if you want the Sheet up to date right away.</p>
        <button class="btn soft" id="dbCopy">${icon('download')}Copy to the Sheet now</button>
        <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
        <p class="small muted">Switching back puts the hub on the Google Sheet again (as of its last copy). Only do this if something's wrong.</p>
        <button class="btn ghost small" id="dbBack">Switch back to the Google Sheet</button></div>`
    : step({ i: 1, done: st.configured }, 'Connect Supabase', `<p class="small muted">In the Apps Script editor → Project Settings → Script Properties, add <code>SUPABASE_URL</code>, <code>SUPABASE_PUBLISHABLE</code> and <code>SUPABASE_SECRET</code>.</p>`) +
      step({ i: 2, done: false }, 'Copy everything over', `<p class="small muted">Copies every section, the settings, roles, permissions and all logins (same usernames and passwords) into Supabase. The Google Sheet isn't changed. Safe to run again.</p>
        <button class="btn" id="dbMigrate" ${st.configured ? '' : 'disabled'}>${icon('refresh')}Copy to Supabase</button><div id="dbRep" class="small" style="margin-top:10px"></div>`) +
      step({ i: 3, done: false }, 'Switch the hub over', `<p class="small muted">From then on, everyone signs in to Supabase and changes show up for everyone instantly. Everyone will need to sign in once more.</p>
        <button class="btn green" id="dbSwitch" ${st.configured ? '' : 'disabled'}>Switch to Supabase</button>`));
  const b = id => $('#' + id, body);
  if (b('dbMigrate')) b('dbMigrate').onclick = async () => {
    if (!(await confirmBox('Copy everything from the Google Sheet into Supabase now? The Sheet itself won\'t change.', { ok: 'Copy now', title: 'Copy to Supabase' }))) return;
    b('dbMigrate').disabled = true; b('dbMigrate').textContent = 'Copying… (about a minute)';
    try {
      const r = (await api('adminMigrate')).result;
      b('dbRep').innerHTML = `<b>Done.</b> ${Object.entries(r.sections).map(([k, n]) => `${esc(k)}: ${n}`).join(' · ')}<br>Logins: ${r.users.created} created, ${r.users.existing} already there` +
        (r.users.failed.length ? `<div style="color:var(--red)">Couldn't copy: ${r.users.failed.map(esc).join('; ')}</div>` : '');
      toast('Copied to Supabase', 'ok');
    } catch (e) { fail(e); }
    b('dbMigrate').disabled = false; b('dbMigrate').textContent = 'Copy again';
  };
  if (b('dbSwitch')) b('dbSwitch').onclick = async () => {
    if (!(await confirmBox('Switch the hub to Supabase? Everyone (you too) will be asked to sign in again with the same username and password.', { ok: 'Switch now', title: 'Switch to Supabase' }))) return;
    try { await api('adminDbMode', { mode: 'supabase' }); store.del(LIVE_CONF_KEY); toast('Switched — signing you in again…', 'ok'); setTimeout(() => location.reload(), 900); } catch (e) { fail(e); }
  };
  if (b('dbCopy')) b('dbCopy').onclick = async () => {
    b('dbCopy').disabled = true; b('dbCopy').textContent = 'Copying…';
    try { toast((await api('adminCopyToSheets')).result, 'ok'); } catch (e) { fail(e); }
    adminDatabase(body);
  };
  if (b('dbBack')) b('dbBack').onclick = async () => {
    if (!(await confirmBox('Switch back to the Google Sheet? Changes made since the last backup copy would not be there — copy first.', { ok: 'Switch back', danger: true }))) return;
    try { await api('adminDbMode', { mode: 'sheets' }); await liveSignOut(); store.del(LIVE_CONF_KEY); location.reload(); } catch (e) { fail(e); }
  };
}

start();
</script>
</body>
